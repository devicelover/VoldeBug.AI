   number typed on a plain page. It now lands on a saturated card like the
   hero, with the score drawn as a ring that fills rather than printed. */
.result {
  text-align: center;
  padding: 30px 22px 26px;
  border: none;
  color: #fff;
  background: linear-gradient(150deg,
    color-mix(in srgb, var(--violet) 84%, #000) 0%,
    var(--violet) 50%,
    color-mix(in srgb, var(--accent-2) 92%, var(--violet)) 128%);
  box-shadow: var(--shadow-accent);
}
.result--mastered {
  background: linear-gradient(150deg, #0d7a4e 0%, var(--sprout) 62%, #7fd98a 132%);
  box-shadow: 0 6px 22px color-mix(in srgb, var(--sprout) 34%, transparent);
}
.result--retry {
  background: linear-gradient(150deg, var(--ink) 0%, var(--ink-2) 100%);
  box-shadow: var(--shadow-lift);
}
.result__ringwrap { position: relative; width: 150px; height: 150px; margin: 0 auto 14px; display: grid; place-items: center; }
.result__ring { position: absolute; inset: 0; transform: rotate(-90deg); }
.result__track { fill: none; stroke: rgba(255,255,255,.22); stroke-width: 11; }
.result__fill {
  fill: none; stroke: #fff; stroke-width: 11; stroke-linecap: round;
  animation: resultRing 1.1s var(--ease) both;
}
@keyframes resultRing { from { stroke-dashoffset: 400; } }
.result__pct { display: flex; align-items: baseline; gap: 1px; font-family: var(--font-display); }
.result__pct b { font-size: 44px; font-weight: 800; line-height: 1; }
.result__pct i { font-size: 19px; font-style: normal; opacity: .8; }
.result__head { font-family: var(--font-display); font-size: 25px; font-weight: 700; }
.result__sub { font-size: 14px; opacity: .84; font-weight: 600; margin-top: 4px; }
.result__tag {
  display: inline-block; margin-top: 14px; padding: 6px 14px; border-radius: var(--pill);
  background: rgba(255,255,255,.2); border: 1px solid rgba(255,255,255,.3);
  font-size: 13px; font-weight: 700;
}
.result__tag--quiet { background: rgba(255,255,255,.12); }
.result__beat { margin-top: 12px; font-size: 13px; font-weight: 700; color: var(--volt); }

/* --- A page floor. Two cards and a long void read as broken rather than
   new; a quiet closing line tells the student what is actually there. --- */
.page-floor {
  text-align: center; font-size: 12.5px; font-weight: 600;
  color: var(--dim); opacity: .8; padding: 22px 0 4px;
}

/* --- Wide tables cut off mid-column with no hint they scroll. The fade
   tells you there is more to the right; it disappears once you reach it. --- */
.tbl__scroll {
  position: relative;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
  background:
    linear-gradient(to right, var(--surface) 30%, rgba(255,255,255,0)) left / 34px 100% no-repeat,
    linear-gradient(to left, var(--surface) 30%, rgba(255,255,255,0)) right / 34px 100% no-repeat,
    radial-gradient(farthest-side at 0 50%, rgba(23,31,61,.14), transparent) left / 14px 100% no-repeat,
    radial-gradient(farthest-side at 100% 50%, rgba(23,31,61,.14), transparent) right / 14px 100% no-repeat;
  background-attachment: local, local, scroll, scroll;
}

/* ===========================================================================
   USER-GENERATED TEXT
   Everything a student or teacher types has to be assumed hostile to layout.
   A long title with no spaces — a filename, a pasted URL, a run-on word —
   cannot be broken at a space, so the browser lets it push the page wider
   than the viewport and every screen in the app gains a horizontal scroll.
   Confirmed: a 70-character unbroken title took a 420px page to 579px.
   =========================================================================== */
.creation-card__title,
.creation-card__meta,
.creation-card__note,
.hist-item__text,
.res-item__title,
.res-item__meta,
.plan-day__title,
.plan-day__meta,
.plan-day__note,
.prompt-box__text,
.magic-out,
.row__name,
.tbl__name,
.hero__hi,
.badge__name,
.tool__name,
.pick-row__label,
.tpl-tile__name,
.cat-tile__name {
  overflow-wrap: anywhere;
  word-break: break-word;
  min-width: 0;
}

/* Flex and grid children default to min-width:auto, which refuses to shrink
   below their content — so the wrap rules above cannot take effect inside
   them until this is set. */
.creation-card__body,
.res-item__body,
.tool__body,
.hist-item,
.pick-row,
.module-row__body { min-width: 0; }

/* ===========================================================================
   COLOUR SYSTEM — colourful where it helps, calm where you read
   ---------------------------------------------------------------------------
   "More colourful" and "study friendly" pull against each other, so the
   colour is placed rather than spread. Saturated colour goes on things you
   SCAN — category tiles, template tiles, stat cards, icons, headers. It
   stays off things you READ — chapter text, prompt output, quiz questions,
   tables, notes — because a tinted ground under a paragraph is what causes
   fatigue over a forty-minute period.
   Each category owns a hue and keeps it everywhere it appears, so a student
   learns "the teal ones are for studying" before they read a single label.
   =========================================================================== */

/* --- category tiles: full colour, since these are pure navigation --- */
.cat-tile {
  background: linear-gradient(150deg,
    color-mix(in srgb, var(--c) 13%, var(--surface)) 0%,
    color-mix(in srgb, var(--c2) 10%, var(--surface)) 100%);
  border-color: color-mix(in srgb, var(--c) 30%, transparent);
}
.cat-tile:hover {
  border-color: color-mix(in srgb, var(--c) 62%, transparent);
  box-shadow: 0 8px 22px color-mix(in srgb, var(--c) 22%, transparent);
}
.cat-tile__name { color: color-mix(in srgb, var(--c) 72%, var(--text)); }
.cat-tile__count { color: color-mix(in srgb, var(--c) 46%, var(--dim)); }
[data-theme="dark"] .cat-tile {
  background: linear-gradient(150deg,
    color-mix(in srgb, var(--c) 22%, var(--surface)) 0%,
    color-mix(in srgb, var(--c2) 15%, var(--surface)) 100%);
  border-color: color-mix(in srgb, var(--c) 40%, transparent);
}
[data-theme="dark"] .cat-tile__name { color: color-mix(in srgb, var(--c2) 55%, #fff); }

/* --- template tiles: same treatment, per output type --- */
.tpl-tile {
  background: linear-gradient(150deg,
    color-mix(in srgb, var(--c) 12%, var(--surface)) 0%,
    color-mix(in srgb, var(--c2) 9%, var(--surface)) 100%);
  border-color: color-mix(in srgb, var(--c) 28%, transparent);
}
.tpl-tile:hover {
  border-color: color-mix(in srgb, var(--c) 60%, transparent);
  box-shadow: 0 8px 22px color-mix(in srgb, var(--c) 20%, transparent);
}
.tpl-tile__name { color: color-mix(in srgb, var(--c) 70%, var(--text)); }
[data-theme="dark"] .tpl-tile {
  background: linear-gradient(150deg,
    color-mix(in srgb, var(--c) 20%, var(--surface)) 0%,
    color-mix(in srgb, var(--c2) 14%, var(--surface)) 100%);
}
[data-theme="dark"] .tpl-tile__name { color: color-mix(in srgb, var(--c2) 52%, #fff); }

/* --- tool rows: the card stays white because the tool NAME is read; only
   the icon tile and the path node carry the category colour --- */
.node .tool__emoji {
  background: linear-gradient(145deg,
    color-mix(in srgb, var(--c) 17%, var(--surface)),
    color-mix(in srgb, var(--c2) 12%, var(--surface)));
  border: 1px solid color-mix(in srgb, var(--c) 24%, transparent);
}
.node.next::before, .node.next::after { background: var(--c, var(--volt)); }
.node .card--tap:hover { border-color: color-mix(in srgb, var(--c) 55%, transparent); }

/* --- stat cards: each number gets its own hue so the row reads as four
   distinct facts rather than one grey block --- */
.stats .stat:nth-child(1) { --c: #5b6ef5; }
.stats .stat:nth-child(2) { --c: #e5761c; }
.stats .stat:nth-child(3) { --c: #0d9c8a; }
.stats .stat:nth-child(4) { --c: #e0448f; }
.stats .stat {
  background: linear-gradient(160deg,
    color-mix(in srgb, var(--c) 9%, var(--surface)) 0%,
    var(--surface) 72%);
  border-color: color-mix(in srgb, var(--c) 22%, var(--border));
}
.stats .stat__k { color: color-mix(in srgb, var(--c) 78%, var(--text)); }
.stats .stat::after { background: var(--c); }
[data-theme="dark"] .stats .stat {
  background: linear-gradient(160deg, color-mix(in srgb, var(--c) 18%, var(--surface)) 0%, var(--surface) 72%);
}
[data-theme="dark"] .stats .stat__k { color: color-mix(in srgb, var(--c) 40%, #fff); }

/* --- section headings get a coloured rule, which adds colour to every
   screen without touching a single word of body copy --- */
.sec-head h2 { position: relative; padding-left: 13px; }
.sec-head h2::before {
  content: '';
  position: absolute; left: 0; top: 0.16em; bottom: 0.16em;
  width: 4px; border-radius: 3px;
  background: linear-gradient(180deg, var(--violet), var(--accent-2));
}

/* --- badges already carry rarity colour; give the locked ones a faint
   tint too so the grid is not a wall of grey --- */
.badge.locked .badge__face {
  background: linear-gradient(160deg, color-mix(in srgb, var(--violet) 5%, var(--surface-2)), var(--surface-2));
}

/* --- empty states: a coloured wash so a page with nothing on it still
   feels like part of the product --- */
.empty-state {
  background: linear-gradient(170deg,
    color-mix(in srgb, var(--violet) 7%, var(--surface)) 0%,
    var(--surface) 70%);
}

/* Fallback: without color-mix every tint above collapses to nothing, which
   is a graceful loss — the layout is unaffected and only the colour goes. */

/* ===========================================================================
   VOYAGE — the learning journey as a flight through space
   The one screen in the app that deliberately breaks the paper metaphor.
   It is a reward surface, not a reading surface: nobody studies here, they
   look at what they have done. That is what licenses a full dark starfield
   in a product otherwise built to be read from for forty minutes.
   =========================================================================== */

.voyage {
  position: relative;
  background: radial-gradient(120% 80% at 50% 0%, #2a1d5e 0%, #141031 45%, #0a0820 100%);
  margin: -18px -16px 0;
  padding: 26px 16px calc(var(--tabbar-h) + 40px);
  min-height: 100vh;
  color: #eef0ff;
  overflow: hidden;
}
@media (min-width: 960px) { .voyage { margin: -26px -30px 0; padding: 32px 30px 60px; border-radius: var(--r-lg); } }

.voyage__sky { position: absolute; inset: 0; pointer-events: none; }
.star {
  position: absolute; background: #fff; border-radius: 50%;
  opacity: 0.7; animation: twinkle 3.4s ease-in-out infinite;
}
@keyframes twinkle { 0%, 100% { opacity: 0.22; } 50% { opacity: 0.9; } }

.voyage__head { position: relative; text-align: center; margin-bottom: 26px; }
.voyage__eyebrow {
  font-size: 11px; font-weight: 800; letter-spacing: 0.22em; text-transform: uppercase;
  color: #8f86ff;
}
.voyage__title { font-size: 30px; color: #fff; margin-top: 6px; }
.voyage__sub { font-size: 14px; color: #b9bce6; font-weight: 500; margin-top: 5px; }
.voyage__stats {
  display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-top: 14px;
}
.voyage__stats span {
  background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14);
  border-radius: var(--pill); padding: 5px 13px; font-size: 12.5px; color: #d5d7f5; font-weight: 600;
}
.voyage__stats b { font-family: var(--font-mono); color: #fff; font-weight: 700; }

/* --- the flight path --- */
.voyage__track { position: relative; padding: 6px 0 0; }
.voyage__line {
  position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; transform: translateX(-50%);
  background: linear-gradient(180deg, #8f86ff 0%, rgba(143,134,255,.35) 55%, rgba(143,134,255,.08) 100%);
}

.voyage__now { position: relative; text-align: center; margin-bottom: 8px; }
.voyage__rocket {
  display: inline-block; font-size: 34px; line-height: 1;
  filter: drop-shadow(0 0 14px rgba(255,170,80,.65));
  animation: hover 3s ease-in-out infinite;
}
@keyframes hover { 50% { transform: translateY(-7px); } }
.voyage__rocket--idle { font-size: 54px; }
.voyage__nowlabel {
  display: block; font-size: 11px; font-weight: 800; letter-spacing: 0.14em;
  text-transform: uppercase; color: #ffb45e; margin-top: 2px;
}

.voyage__stop {
  position: relative; display: flex; align-items: center; gap: 12px;
  min-height: 74px;
  animation: cardIn 0.5s var(--ease) both;
  animation-delay: calc(var(--i) * 45ms);
}
.voyage__stop--left  { flex-direction: row; }
.voyage__stop--right { flex-direction: row-reverse; }

.voyage__dot {
  position: absolute; left: 50%; transform: translateX(-50%);
  width: 38px; height: 38px; border-radius: 50%;
  display: grid; place-items: center; font-size: 17px; z-index: 2;
  background: #16123a;
  border: 2px solid var(--c);
  box-shadow: 0 0 16px color-mix(in srgb, var(--c) 55%, transparent);
}

.voyage__card {
  width: calc(50% - 30px);
  background: rgba(255,255,255,.07);
  border: 1px solid color-mix(in srgb, var(--c) 38%, transparent);
  border-radius: var(--r);
  padding: 11px 13px;
  backdrop-filter: blur(6px);
}
.voyage__stop--right .voyage__card { margin-left: auto; }
.voyage__kind {
  font-size: 10.5px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--c); filter: brightness(1.5);
}
.voyage__label {
  font-family: var(--font-display); font-weight: 700; font-size: 15px; color: #fff;
  line-height: 1.25; margin-top: 3px; overflow-wrap: anywhere;
}
.voyage__meta { font-size: 12.5px; color: #b9bce6; font-weight: 500; margin-top: 2px; overflow-wrap: anywhere; }
.voyage__when { font-family: var(--font-mono); font-size: 11px; color: #8086b8; margin-top: 5px; }

.voyage__origin { position: relative; text-align: center; padding-top: 12px; }
.voyage__originDot {
  display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 50%;
  background: #16123a; border: 2px solid #4ea0ff; font-size: 20px;
  box-shadow: 0 0 20px rgba(78,160,255,.45);
}
.voyage__originLabel {
  display: block; font-size: 11px; font-weight: 800; letter-spacing: 0.14em;
  text-transform: uppercase; color: #6f7bb8; margin-top: 5px;
}

.voyage__empty { position: relative; text-align: center; padding: 44px 20px; }
.voyage__emptytitle { font-family: var(--font-display); font-size: 20px; color: #fff; margin-top: 14px; }
.voyage__emptysub {
  font-size: 14px; color: #b9bce6; font-weight: 500; line-height: 1.55;
  max-width: 300px; margin: 8px auto 20px;
}

/* --- the Home teaser --- */
.voyage-teaser {
  position: relative; overflow: hidden;
  display: flex; align-items: center; gap: 13px; text-align: left;
  background: linear-gradient(120deg, #211a52 0%, #2f2472 55%, #4a2f7d 100%);
  border-color: rgba(143,134,255,.4);
  color: #eef0ff;
}
.voyage-teaser__sky { position: absolute; inset: 0; pointer-events: none; }
.voyage-teaser__rocket {
  font-size: 27px; flex-shrink: 0; position: relative;
  filter: drop-shadow(0 0 10px rgba(255,170,80,.6));
  animation: hover 3s ease-in-out infinite;
}
.voyage-teaser__body { flex: 1; min-width: 0; position: relative; }
.voyage-teaser__body b { font-family: var(--font-display); font-size: 16px; color: #fff; display: block; }
.voyage-teaser__body span { font-size: 12.5px; color: #b9bce6; font-weight: 600; }
.voyage-teaser__go { color: #8f86ff; font-size: 20px; position: relative; }

@media (prefers-reduced-motion: reduce) {
  .star, .voyage__rocket, .voyage-teaser__rocket { animation: none !important; }
}

/* The voyage owns the whole page while it is open. Without this the page
   colour showed as a white strip under the starfield whenever the log was
   shorter than the viewport. */
[data-route="voyage"] body { background: #0a0820; }
[data-route="voyage"] .content { padding-bottom: 0; }

/* ===========================================================================
   VOYAGE — launch sequence
   Three phases: a pad you tap, a 1.5s liftoff, then the journey arriving
   stop by stop as if the rocket were flying past each one. The reveal is
   staggered by index and capped, so a long history still finishes quickly
   rather than making a student wait through sixty entries.
   =========================================================================== */

/* --- the pad --- */
.voyage--pad { display: grid; place-items: center; }
.voyage__pad { position: relative; text-align: center; padding: 30px 0; }

.voyage__launchBtn {
  position: relative;
  width: 168px; height: 168px;
  margin: 6px auto 22px;
  display: grid; place-items: center;
  border-radius: 50%;
  background: radial-gradient(circle at 50% 55%, rgba(143,134,255,.28), rgba(143,134,255,0) 68%);
  border: none; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.2s var(--pop);
}
.voyage__launchBtn:hover { transform: scale(1.05); }
.voyage__launchBtn:active { transform: scale(0.95); }

.voyage__padGlow {
  position: absolute; inset: 24%;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,170,80,.5), rgba(255,120,60,0) 70%);
  animation: padGlow 2.4s ease-in-out infinite;
}
@keyframes padGlow { 50% { transform: scale(1.28); opacity: .65; } }

.voyage__padRocket {
  position: relative; font-size: 62px; line-height: 1;
  filter: drop-shadow(0 0 20px rgba(255,170,80,.75));
  animation: hover 2.6s ease-in-out infinite;
}

/* Two rings pulsing outward — the visual invitation to press. */
.voyage__ring {
  position: absolute; inset: 8%;
  border: 2px solid rgba(143,134,255,.55);
  border-radius: 50%;
  animation: ringOut 2.8s var(--ease) infinite;
}
.voyage__ring--2 { animation-delay: 1.4s; }
@keyframes ringOut {
  0%   { transform: scale(0.55); opacity: 0.75; }
  100% { transform: scale(1.25); opacity: 0; }
}

.voyage__tap {
  font-family: var(--font-display); font-size: 20px; font-weight: 700; color: #fff;
}
.voyage__tapsub {
  font-size: 13.5px; color: #b9bce6; font-weight: 500; margin-top: 5px;
  max-width: 260px; margin-inline: auto; line-height: 1.5;
}

/* --- liftoff --- */
.voyage.is-launching { overflow: hidden; }
.voyage.is-launching .voyage__track { opacity: 0; }
.voyage.is-launching .voyage__head { animation: headFade 1.5s var(--ease) forwards; }
@keyframes headFade { 0% { opacity: 1; } 55% { opacity: 1; } 100% { opacity: 0.25; } }

/* Stars stretch and fall as the rocket climbs — the speed cue that sells
   the liftoff without moving anything expensive. */
.voyage__warp { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
.streak {
  position: absolute;
  width: 2px !important; height: 16px !important;
  background: linear-gradient(180deg, rgba(255,255,255,0), #fff 40%, rgba(255,255,255,0));
  border-radius: 2px;
  animation: warp 0.8s linear infinite;
}
@keyframes warp {
  0%   { transform: translateY(-60px) scaleY(1); opacity: 0; }
  30%  { opacity: .9; }
  100% { transform: translateY(120vh) scaleY(9); opacity: 0; }
}

.voyage.is-launching::after {
  content: '\01F680';  /* rocket — CSS takes a codepoint, not a surrogate pair */
  position: absolute; left: 50%; top: 58%;
  font-size: 66px; z-index: 4;
  filter: drop-shadow(0 0 30px rgba(255,170,80,.95));
  animation: liftoff 1.5s cubic-bezier(0.42, 0, 0.58, 1) forwards;
}
@keyframes liftoff {
  0%   { transform: translate(-50%, 40px) scale(0.9); opacity: 0; }
  14%  { transform: translate(-50%, 14px) scale(1.04); opacity: 1; }
  26%  { transform: translate(-50%, 22px) scale(0.98); opacity: 1; }
  100% { transform: translate(-50%, -78vh) scale(0.55); opacity: 0; }
}

/* The exhaust plume, drawn under the rocket and stretching as it climbs. */
.voyage.is-launching::before {
  content: '';
  position: absolute; left: 50%; top: 58%;
  width: 16px; height: 90px; z-index: 3;
  transform: translate(-50%, 62px);
  background: linear-gradient(180deg, rgba(255,190,90,.95), rgba(255,110,50,.5) 45%, rgba(255,80,40,0));
  border-radius: 50% 50% 40% 40%;
  filter: blur(5px);
  animation: plume 1.5s cubic-bezier(0.42, 0, 0.58, 1) forwards;
}
@keyframes plume {
  0%   { transform: translate(-50%, 96px) scaleY(0.2); opacity: 0; }
  16%  { transform: translate(-50%, 74px) scaleY(1); opacity: 1; }
  100% { transform: translate(-50%, -70vh) scaleY(2.6); opacity: 0; }
}

/* --- the cruise: each stop arrives in turn --- */
.voyage.is-cruising .voyage__head { animation: cardIn 0.5s var(--ease) both; }
.voyage.is-cruising .voyage__now  { animation: dropIn 0.6s var(--pop) both 0.15s; }
@keyframes dropIn { from { transform: translateY(-40px); opacity: 0; } }

.voyage.is-cruising .voyage__line {
  transform-origin: top;
  animation: lineGrow 0.9s var(--ease) both 0.2s;
}
@keyframes lineGrow { from { transform: scaleY(0); } }

/* min() caps the total wait: sixty stops staggered at 110ms would be a
   seven-second sit-through, so late entries share the tail of the sequence. */
.voyage.is-cruising .voyage__stop {
  animation: stopIn 0.55s var(--pop) both;
  animation-delay: calc(0.35s + min(var(--i) * 110ms, 2.4s));
}
@keyframes stopIn {
  from { transform: translateY(26px) scale(0.94); opacity: 0; }
}
.voyage.is-cruising .voyage__dot { animation: popIn 0.4s var(--pop) both; animation-delay: calc(0.45s + min(var(--i) * 110ms, 2.4s)); }
.voyage.is-cruising .voyage__origin { animation: cardIn 0.6s var(--ease) both 0.5s; }

.voyage__replay {
  display: block; margin: 26px auto 0;
  background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18);
  color: #d5d7f5; border-radius: var(--pill);
  padding: 9px 20px; font-size: 13px; font-weight: 700;
  transition: background 0.2s, transform 0.16s var(--pop);
}
.voyage__replay:hover { background: rgba(255,255,255,.15); transform: translateY(-2px); }
.voyage__replay:active { transform: scale(0.96); }

@media (prefers-reduced-motion: reduce) {
  .voyage__ring, .voyage__padGlow, .voyage__padRocket, .streak { animation: none !important; }
  .voyage.is-cruising .voyage__stop,
  .voyage.is-cruising .voyage__dot,
  .voyage.is-cruising .voyage__head,
  .voyage.is-cruising .voyage__now,
  .voyage.is-cruising .voyage__line,
  .voyage.is-cruising .voyage__origin { animation: none !important; opacity: 1; transform: none; }
}

/* ===========================================================================
   QUESTION PAPER SETTER
   Reuses .report-doc, .sample-banner and the report-doc__* header/footer
   classes so a question paper, a school report and a lesson plan all read as
   the same family of document once printed.
   =========================================================================== */

.paper-chaps { display: grid; gap: 8px; }
.paper-chap {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border: 1.5px solid var(--border); border-radius: var(--r-sm);
  font-size: 14px; font-weight: 600; cursor: pointer;
  transition: border-color 0.18s, background 0.18s;
}
.paper-chap:hover { border-color: var(--violet); }
.paper-chap input { width: 17px; height: 17px; accent-color: var(--violet); flex-shrink: 0; }

.paper-diffread { font-size: 12.5px; color: var(--dim); font-weight: 600; margin-top: 7px; }

/* `composes:` is CSS-Modules syntax and does nothing in a plain stylesheet
   — caught by actually rendering this, not by reading the code back. Real
   properties, matching .report-doc exactly so a question paper prints as
   the same family of document as a school report. */
.paper-doc {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r);
  padding: 32px; box-shadow: var(--shadow);
}
.paper-instr { padding-left: 20px; font-size: 14px; line-height: 1.7; }
.paper-secmarks { font-size: 13px; font-weight: 600; color: var(--dim); }
.paper-q { font-size: 14px; line-height: 1.8; margin: 4px 0; }
.paper-note { font-size: 13px; color: var(--dim); font-weight: 600; margin-bottom: 10px; }
.paper-roundnote { font-size: 12.5px; color: var(--dim); font-style: italic; margin-top: 4px; }
.paper-marks { font-size: 12.5px; color: var(--dim); font-weight: 600; }

.paper-tag {
  display: inline-block; font-size: 10.5px; font-weight: 800; letter-spacing: 0.04em;
  text-transform: uppercase; padding: 2px 8px; border-radius: var(--pill); margin: 0 4px;
}
.paper-tag--easy   { background: rgba(31,157,99,.14); color: var(--sprout-deep); }
.paper-tag--medium { background: rgba(138,96,0,.14);  color: var(--volt-deep); }
.paper-tag--hard   { background: rgba(184,45,25,.14); color: var(--flame-deep); }
[data-theme="dark"] .paper-tag--easy   { color: var(--sprout); }
[data-theme="dark"] .paper-tag--medium { color: var(--volt); }
[data-theme="dark"] .paper-tag--hard   { color: var(--flame); }

.paper-break { height: 1px; background: var(--border); margin: 22px 0; }

@media print {
  .paper-break { break-before: page; height: 0; background: none; margin: 0; }
  .paper-tag { border: 1px solid #999 !important; background: #fff !important; color: #000 !important; }
  .paper-secmarks, .paper-marks, .paper-note, .paper-roundnote { color: #444 !important; }
}

/* ===========================================================================
   PROMPT SANDBOX
   A checklist, not a chat — see the long comment above viewPromptSandbox()
   in app.js for why that distinction mattered for this specific feature.
   =========================================================================== */
.sandbox textarea.input { resize: vertical; min-height: 78px; font-family: var(--font-body); }

.sandbox-result__head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.sandbox-score {
  font-family: var(--font-mono); font-weight: 700; font-size: 15px;
  border-radius: var(--pill); padding: 5px 12px;
}
.sandbox-score--weak   { background: color-mix(in srgb, var(--flame) 14%, var(--surface-2)); color: var(--flame-deep); }
.sandbox-score--good   { background: color-mix(in srgb, var(--volt) 18%, var(--surface-2)); color: var(--volt-deep); }
.sandbox-score--strong { background: color-mix(in srgb, var(--sprout) 16%, var(--surface-2)); color: var(--sprout-deep); }
.sandbox-tier { font-weight: 700; font-size: 14.5px; }

.sandbox-checks { list-style: none; }
.sandbox-check {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 9px 0; border-top: 1px solid var(--rule);
}
.sandbox-check:first-child { border-top: none; padding-top: 0; }
.sandbox-check__mark {
  flex-shrink: 0; width: 20px; height: 20px; border-radius: 50%;
  display: grid; place-items: center; font-size: 11px; font-weight: 700;
  margin-top: 1px;
}
.sandbox-check.is-pass .sandbox-check__mark { background: var(--sprout); color: #fff; }
.sandbox-check.is-fail .sandbox-check__mark { background: var(--surface-2); color: var(--dim); border: 1px solid var(--border); }
.sandbox-check__body { flex: 1; min-width: 0; }
.sandbox-check__label { font-weight: 700; font-size: 14px; display: block; }
.sandbox-check.is-fail .sandbox-check__label { color: var(--dim); }
.sandbox-check__tip { font-size: 12.5px; color: var(--dim); font-weight: 500; display: block; margin-top: 2px; line-height: 1.45; }

/* ===========================================================================
   VOLDY — the in-app guide (not a chatbot)
   Deliberately built as tappable rows, never a text input — see the long
   comment above VOLDY_TOPICS in app.js for why a free-text box here would
   have been the wrong call regardless of how it was worded.
   =========================================================================== */
.voldy-fab {
  position: fixed; right: 16px;
  bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 14px);
  z-index: 40;
  width: 52px; height: 52px; border-radius: 50%;
  display: grid; place-items: center;
  background: linear-gradient(150deg, color-mix(in srgb, var(--violet) 92%, #fff) 0%, var(--violet) 60%, color-mix(in srgb, var(--accent-2) 88%, var(--violet)) 100%);
  border: 1px solid color-mix(in srgb, var(--violet) 68%, #000);
  box-shadow: 0 4px 14px color-mix(in srgb, var(--violet) 38%, transparent);
  transition: transform 0.18s var(--pop);
}
.voldy-fab:hover { transform: translateY(-2px) scale(1.04); }
.voldy-fab:active { transform: scale(0.92); }
.voldy-fab__face { font-size: 24px; line-height: 1; filter: drop-shadow(0 1px 1px rgba(0,0,0,.2)); animation: voldyBob 3.2s ease-in-out infinite; }
@keyframes voldyBob { 50% { transform: translateY(-2px); } }
@media (min-width: 960px) { .voldy-fab { bottom: 22px; } }
@media (prefers-reduced-motion: reduce) { .voldy-fab__face { animation: none; } }

.voldy-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.voldy-head__face {
  flex-shrink: 0; width: 44px; height: 44px; border-radius: 50%;
  display: grid; place-items: center; font-size: 22px;
  background: var(--surface-2); border: 1px solid var(--border);
}
.voldy-head__body { display: flex; flex-direction: column; }
.voldy-head__body b { font-family: var(--font-display); font-size: 17px; }
.voldy-head__body span { font-size: 13px; color: var(--dim); font-weight: 500; margin-top: 1px; }

.voldy-list { display: flex; flex-direction: column; gap: 8px; }
.voldy-q {
  display: flex; align-items: center; gap: 11px;
  padding: 12px 14px; border-radius: var(--r); border: 1.5px solid var(--border);
  background: var(--surface); width: 100%; text-align: left;
  transition: border-color 0.18s, transform 0.16s var(--pop);
}
.voldy-q:hover { border-color: var(--violet); }
.voldy-q:active { transform: scale(0.985); }
.voldy-q__emoji { font-size: 19px; flex-shrink: 0; }
.voldy-q__text { flex: 1; font-weight: 700; font-size: 14.5px; min-width: 0; }
.voldy-q__go { color: var(--dim); flex-shrink: 0; }

.voldy-back {
  font-size: 12.5px; font-weight: 700; color: var(--violet);
  margin-bottom: 14px; padding: 4px 2px;
}
.voldy-bubble {
  display: flex; gap: 11px; align-items: flex-start;
  background: var(--surface-2); border-radius: var(--r);
  padding: 14px; margin-bottom: 14px;
}
.voldy-bubble__face {
  flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%;
  display: grid; place-items: center; font-size: 17px;
  background: var(--surface); border: 1px solid var(--border);
}
.voldy-bubble__text { font-size: 14.5px; line-height: 1.55; font-weight: 500; overflow-wrap: anywhere; }

/* ===========================================================================
   WHATSAPP SHARE
   =========================================================================== */
.field__hint { color: var(--dim); font-size: 12.5px; font-weight: 500; margin-top: 5px; line-height: 1.5; }

/* ===========================================================================
   COVERAGE HEATMAP
   A CSS grid rather than a table: the row/column header cells and the data
   cells share one grid so alignment can never drift between them, and the
   whole thing reflows to a horizontal scroll on a narrow phone without any
   extra markup.
   =========================================================================== */
.heat-legend { display: flex; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
.heat-legend span { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; color: var(--dim); }
.heat-legend__sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.heat-legend__sw--good { background: var(--sprout); }
.heat-legend__sw--mid { background: var(--volt); }
.heat-legend__sw--low { background: var(--flame); }

.heat-group-label {
  font-size: 12px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--dim); margin-bottom: 8px;
}

.heatgrid {
  display: grid;
  grid-template-columns: 84px repeat(var(--cols), minmax(64px, 1fr));
  gap: 4px;
  overflow-x: auto;
  padding-bottom: 4px;
}
.heatgrid__corner { background: transparent; }
.heatgrid__colhead, .heatgrid__rowhead {
  font-size: 11px; font-weight: 800; color: var(--dim);
  display: flex; align-items: center;
  padding: 4px 2px;
}
.heatgrid__colhead { justify-content: center; text-align: center; line-height: 1.25; }
.heatgrid__rowhead { white-space: nowrap; }

.heatcell {
  border-radius: var(--r-sm);
  display: grid; place-items: center;
  min-height: 44px;
  font-family: var(--font-mono); font-size: 12.5px; font-weight: 700;
  color: #fff;
  transition: transform 0.16s var(--pop);
}

/* Every tool lookup in the app must go through this — EXTRA_TOOLS holds 40+
   of the 50+ tools, and a lookup that only checks TOOLS silently fails on all
   of them (the button does nothing, with no error). Built once at load. */
const ALL_TOOLS = [...TOOLS, ...EXTRA_TOOLS];
const TOOL_BY_SLUG = new Map(ALL_TOOLS.map(t => [t.slug, t]));

function groupCfg() { return CLASS_GROUPS[S.classGroup] || CLASS_GROUPS.middle; }
function groupTools() {
  const cfg = groupCfg();
  return cfg.toolSlugs.map(slug => TOOL_BY_SLUG.get(slug)).filter(Boolean);
}
function groupTitleFor(lv) {
  const cfg = groupCfg();
  const titles = cfg.titles || TITLES;
  let cur = titles[0];
  for (const tl of titles) if (lv >= tl[0]) cur = tl;
  return cur;
}
function groupQuests() { return groupCfg().questPool || QUESTS; }

   CURRICULUM — Section 3: Board > Class > Subject > Chapter > Prompt set.
   NCERT chapter links point to the real textbook.php pattern on ncert.nic.in
   (verified against the same source used for the earlier NCERT Library).
   GSEB has no equivalent deep-linkable chapter PDFs I could verify, so those
   entries link to the official state portal (gujarat-education.gov.in) at
   the subject level and are clearly marked as sample content — see
   gsebSampleNote, shown wherever a GSEB chapter is opened.
   This is intentionally a handful of chapters per subject, not the full
   syllabus — the change request explicitly asks for a structure that scales
   from an admin-editable table, not a one-time content dump.
   =========================================================================== */
/* ===========================================================================
   AI PROMPT LIBRARY — from Voldebug_AI_Prompt_Library.docx
   ---------------------------------------------------------------------------
   Three parts, matching the source document's own structure:
   - PROMPT_TEMPLATES (its "Section A"): 6 reusable formulas, one per output
     type. build() renders live from whatever the student types in — this is
     what turns a static bracketed template into an actual interactive tool.
   - PROMPT_TOOL_DIRECTORY (its "Section B"): quick-reference tool list by
     output type. Kept as its own small tool set rather than folded into the
     main 51-tool Explore library — these are content-generation tools
     (slides, diagrams, mind maps) that don't fit any of Explore's existing
     6 categories, and forcing a fit would be worse than keeping them
     separate and honest about what they're for.
   - PROMPT_EXAMPLES (its "Section C"): worked examples per class/subject.
     The source document itself flags these topic names as illustrative,
     to be matched against the real current NCERT/GSEB edition before
     publishing — carried through here as promptLibrarySampleNote, same
     honesty pattern as the GSEB curriculum notice.
   One correction made silently: the source document's example "age"
   climbs as Class+10 (a Class 6 prompt targets a "16-year-old"), which
   doesn't reflect real classroom ages. AGE_FOR_CLASS below uses realistic
   ages instead, since a wrong age in a generated prompt would produce a
   worse result for the student, not just a cosmetic mismatch.
   =========================================================================== */

/* The count field is free-typed, and a browser's min/max attributes are a
   UI hint, not an enforced constraint on the raw value JS reads back — a
   student can type 0, a negative number, or 500 and .value will happily
   return exactly that string. Every one of those needs to become a sane
   slide count, not get pasted straight into the prompt. */
function clampSlideCount(raw) {
  const n = parseInt(raw, 10);
  if (!Number.isFinite(n)) return 8;
  return Math.min(15, Math.max(4, n));
}

  /* Deliberately the lightest of the five: one topic, one class, one marks
     total, in the same single-click pattern as the other four. It reuses
     distributeSections — the exact section-and-marks logic the full Question
     Paper Setter is built and tested on — rather than a second, looser
     implementation, so a quick paper and a real exam paper never disagree
     about what a "20% weight, 3-mark section" actually means. What it
     produces on purpose is structure and marks, honestly totalled; what it
     never produces is real question text, matching every other card here. */
  { key:'quickpaper', emoji:'🗒️', n:{en:'Quick Question Paper',hi:'त्वरित प्रश्न पत्र'},
    d:{en:'A properly sectioned paper — MCQ, short and long answer — in one shot.',hi:'एक ही बार में सही खंडों वाला पत्र — बहुविकल्पीय, लघु और दीर्घ उत्तर।'},
    fields:[
      {k:'topic', label:{en:'Topic / Chapter',hi:'विषय / अध्याय'}, ph:{en:'e.g. Life Processes',hi:'जैसे: जैविक प्रक्रियाएँ'}},
      {k:'cls', label:{en:'Class',hi:'कक्षा'}, ph:{en:'e.g. 10',hi:'जैसे: 10'}},
      {k:'marks', label:{en:'Total marks',hi:'कुल अंक'}, ph:{en:'25',hi:'25'}}
    ],
    build: (v, L) => {
      const requested = Math.min(100, Math.max(10, parseInt(v.marks, 10) || 25));
      const sections = distributeSections(requested, 'four');
      const achieved = sections.reduce((a, s) => a + s.marks, 0);
      const topic = v.topic || (L ? 'यह विषय' : 'this topic');
      const lines = [
        `# ${L ? 'प्रश्न पत्र' : 'Question Paper'} — ${v.topic || (L ? 'विषय' : 'Topic')}`,
        `${L ? 'कक्षा' : 'Class'} ${v.cls || '__'} · ${L ? 'कुल अंक' : 'Total marks'}: ${achieved}`,
        achieved !== requested ? (L ? `(${requested} से पूर्णांकित)` : `(rounded from ${requested})`) : '',
        ''
      ].filter(Boolean);
      let qn = 1;
      sections.forEach(sec => {
        lines.push(`### ${L ? 'खंड' : 'Section'} ${sec.key} — ${L ? sec.n.hi : sec.n.en} (${sec.count} × ${sec.marksEach} = ${sec.marks})`);
        for (let i = 0; i < sec.count; i++) {
          const markWord = sec.marksEach === 1 ? (L ? 'अंक' : 'mark') : (L ? 'अंक' : 'marks');
          lines.push(`${qn++}. ${L ? `${topic} से जुड़ा एक प्रश्न लिखें` : `[Write a question about ${topic} here]`} (${sec.marksEach} ${markWord})`);
        }
        lines.push('');
      });
      lines.push(L
        ? 'पूर्ण परीक्षा-तैयार पत्र, वास्तविक अध्याय और उत्तर कुंजी सहित चाहिए? टीचर मेनू में "प्रश्न पत्र" खोलें।'
        : 'Need a full exam-ready paper tied to real chapters, with an answer key? Open "Question Paper" from the teacher menu.');
      return lines.join('\n');
    } }
];

/* --------------------------------------------------------------- utilities */

const $ = sel => document.querySelector(sel);
const el = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ------------------------------------------------------- the school's day */

/* "Today" is the school's day, not the device's. A phone on a holiday
   timezone, or simply set wrong, would otherwise move every day boundary in
   the app by hours. Asia/Kolkata has no DST, so the fixed +05:30 offset is
   exact — and this is deliberately the same rule as dayKey() in the API's
   journey.service.ts, because a streak that the server extends and the
   client resets (or the reverse) is worse than no client streak at all. */
function istDayKey(d) {
  return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Kolkata' }).format(d || new Date());
}

/* Whole days from one YYYY-MM-DD key to the next. Both ends are parsed as
   UTC midnight rather than local, so the subtraction is exact whole days
   with no DST or offset remainder to round away. NaN for a malformed key —
   callers treat that as "no idea how long it has been". */
function daysBetweenKeys(from, to) {
  const a = Date.parse(from + 'T00:00:00Z'), b = Date.parse(to + 'T00:00:00Z');
  if (!Number.isFinite(a) || !Number.isFinite(b)) return NaN;
  return Math.round((b - a) / 864e5);
}

/* Mon=0 … Sun=6 for a YYYY-MM-DD key, which is the order the week strip
   labels are written in. getUTCDay() is 0=Sunday, hence the rotation. */
function weekdayIndex(key) {
  const ms = Date.parse(key + 'T00:00:00Z');
  if (!Number.isFinite(ms)) return 6;
  return (new Date(ms).getUTCDay() + 6) % 7;
}

/* S.week is a rolling window of the last seven days, oldest first, so the
   final slot is always today. It used to be *drawn* as a fixed Mon–Sun week
   while being *written* at a hardcoded slot 6, which meant a student who
   completed a quest on Tuesday saw the fire appear under Sunday, and last
   week's marks never expired. Keeping it a window (and deriving the labels
   from the real IST weekday) makes the two agree, and makes "shift left by
   the days that passed" the whole of the expiry logic. */
const WEEK_SLOTS = 7;
const WEEK_TODAY = WEEK_SLOTS - 1;

function weekStripLabels() {
  const names = S.locale === 'hi' ? ['सो', 'मं', 'बु', 'गु', 'शु', 'श', 'र'] : ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
  const today = weekdayIndex(istDayKey(new Date()));
  return Array.from({ length: WEEK_SLOTS }, (_, i) => names[(today - (WEEK_TODAY - i) + WEEK_SLOTS * 2) % 7]);
}

/* Storage is wrapped because this file also gets opened straight from disk
   and inside sandboxed preview frames, where localStorage throws instead of
   returning null. A demo that crashes on load is worse than one that forgets. */

/* localStorage is a string the student's own browser hands back, and on a
   shared school machine it is trivially editable. Anything read out of it is
   therefore untrusted input, not state: a spread over DEFAULTS restores
   missing keys but happily keeps `xp: "banana"` or `badges: 42`, which then
   reaches arithmetic, .includes() and .map() much further from here, where
   the resulting TypeError reads as a bug in a view.
   These coercions are about surviving that, not about preventing cheating —
   a determined student can still set xp to a large number, and only the
   server (which owns XP for a signed-in account) can stop them. */
/* Number() is too forgiving on its own: Number(null), Number([]) and
   Number('') are all a perfectly finite 0, so a corrupted `streak: null`
   would pass isFinite and land on the Home screen as "🔥 0" — a value the
   app's own rule says can never occur. Anything that is not a number or a
   numeric string is treated as absent instead. */
const num = (v, fallback) => {
  if (typeof v !== 'number' && typeof v !== 'string') return fallback;
  const n = Number(v);
  return Number.isFinite(n) ? n : fallback;
};
const strArray = v => Array.isArray(v) ? v.filter(x => typeof x === 'string') : [];

function coerceState(s) {
  // All four are counters, so they are also floored at their domain minimum:
  // a streak or a personal best below 1 is not a smaller number, it is a
  // broken one.
  s.xp = Math.max(0, Math.round(num(s.xp, DEFAULTS.xp)));
  s.streak = Math.max(1, Math.round(num(s.streak, DEFAULTS.streak)));
  s.best = Math.max(1, Math.round(num(s.best, DEFAULTS.best)));
  s.quests = Math.max(0, Math.round(num(s.quests, DEFAULTS.quests)));

  // Quiz scores are percentages and are read back as bar widths and badge
  // thresholds. A non-numeric entry is dropped entirely rather than zeroed:
  // a score of 0 is a claim about a quiz that was actually taken.
  const scores = {};
  if (s.toolScores && typeof s.toolScores === 'object') {
    for (const [k, v] of Object.entries(s.toolScores)) {
      const n = Number(v);
      if (Number.isFinite(n)) scores[k] = Math.max(0, Math.min(100, Math.round(n)));
    }
  }
  s.toolScores = scores;

  s.creations = Array.isArray(s.creations) ? s.creations.filter(c => c && typeof c === 'object') : [];
  // The emoji is rendered unescaped (it is meant to be a glyph, not text), so
  // its length is capped as well as its type — one grapheme can be several
  // code units, but nothing legitimate here is longer than eight.
  s.creations.forEach(c => {
    if (typeof c.emoji !== 'string' || c.emoji.length > 8) c.emoji = '🌟';
  });

  // The week strip is a fixed-length rolling window, and both the streak
  // pass (which slices it) and the render (which indexes it positionally)
  // assume that shape. A stored value of the wrong length or type would
  // throw in one and silently mis-draw in the other.
  const week = Array.isArray(s.week) ? s.week : [];
  s.week = Array.from({ length: WEEK_SLOTS }, (_, i) => (Number(week[i]) > 0 ? 1 : 0));
  s.lastActiveDay = typeof s.lastActiveDay === 'string' ? s.lastActiveDay : '';

  s.badges = strArray(s.badges);
  s.toolsSeen = strArray(s.toolsSeen);
  s.chaptersUsed = strArray(s.chaptersUsed);
  s.promptTemplatesUsed = strArray(s.promptTemplatesUsed);
  s.starterDone = strArray(s.starterDone);
  s.teacherModulesDone = strArray(s.teacherModulesDone);
  return s;
}

/* Told once per session, not once per save. A device that cannot write
   (private mode, a full quota, a locked-down school profile) fails on every
   single save, and a toast on each one would bury the app in warnings about
   a condition the student can do nothing about mid-task. */
let saveWarned = false;

const store = {
  read() {
    try {
      const raw = localStorage.getItem('voldebug.v2');
      return coerceState(raw ? { ...DEFAULTS, ...JSON.parse(raw) } : { ...DEFAULTS });
    } catch { return coerceState({ ...DEFAULTS }); }
  },
  write(s) {
    try {
      localStorage.setItem('voldebug.v2', JSON.stringify(s));
      return true;
    } catch {
      if (!saveWarned) {
        saveWarned = true;
        // t() is defined below this block but only called at runtime, long
        // after the module has finished evaluating.
        try { toast('⚠️ ' + t('saveFailed')); } catch {}
      }
      return false; // memory only — the session still works, it just won't survive
    }
  },
  clear() { try { localStorage.removeItem('voldebug.v2'); } catch {} }
};

let S = store.read();
const save = () => store.write(S);
const t = k => (T[S.locale] && T[S.locale][k]) || T.en[k] || k;
const L = o => (o && (o[S.locale] ?? o.en)) ?? '';

/* ===========================================================================
   CLOUD SYNC — the only network layer in this file
   ---------------------------------------------------------------------------
   Everything below is additive and optional. A signed-out student ("guest")
   never touches the network at all: pushEvent() returns immediately without a
   token, nothing is queued, and every call path is wrapped so a dead backend,
   a blocked localStorage or an aeroplane-mode phone can only ever be a no-op.
   The offline app keeps behaving exactly as it did before this section
   existed — that is the requirement, not a nice-to-have: most of these
   students are on shared, patchy connections.

   Once a student does sign in, the server becomes the source of truth for XP,
   badges and streaks — it is the only place that can stop a determined
   student from simply editing localStorage. This layer's whole job is to keep
   the two in step: queue what happened locally, send it in batches, and adopt
   whatever profile comes back. Local XP still animates instantly (a student
   should never wait on a round-trip to see their reward); the server's number
   quietly replaces it a moment later.
   =========================================================================== */

const API_BASE = '/v1';
const TOKEN_KEY = 'voldebug.token.v1';
const USER_KEY = 'voldebug.user.v1';
const QUEUE_KEY = 'voldebug.syncq.v1';
const BACKFILL_KEY = 'voldebug.backfilled.v1';

const QUEUE_MAX = 100;         // the queue shares localStorage with progress — progress wins
const EVENTS_PER_CALL = 20;    // server contract limit
const API_TIMEOUT_MS = 10000;
const FLUSH_DEBOUNCE_MS = 1500;

const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
const lsDel = k => { try { localStorage.removeItem(k); } catch {} };

const authToken = () => lsGet(TOKEN_KEY) || '';
const signedIn = () => !!authToken();
function authUser() { try { return JSON.parse(lsGet(USER_KEY) || 'null') || null; } catch { return null; } }

/* Single fetch wrapper. Times out rather than hanging a queue flush forever
   on a captive-portal wifi that accepts the connection and never answers. */
async function api(path, opts) {
  const o = opts || {};
  const useAuth = o.auth !== false;
  const token = useAuth ? authToken() : '';
  const ctrl = typeof AbortController === 'function' ? new AbortController() : null;
  const timer = ctrl ? setTimeout(() => { try { ctrl.abort(); } catch {} }, API_TIMEOUT_MS) : null;
  try {
    const headers = { 'Accept': 'application/json' };
    if (o.body != null) headers['Content-Type'] = 'application/json';
    if (token) headers['Authorization'] = 'Bearer ' + token;
    const res = await fetch(API_BASE + path, {
      method: o.method || 'GET',
      headers,
      body: o.body == null ? undefined : JSON.stringify(o.body),
      credentials: 'same-origin',
      signal: ctrl ? ctrl.signal : undefined
    });
    let payload = null;
    try { payload = await res.json(); } catch {}
    // An expired or revoked token is the one failure the student must be told
    // about — silently dropping every sync afterwards would look like the app
    // was saving when it was not.
    if (res.status === 401 && token) forceSignOut(true);
    if (!res.ok) {
      const err = new Error((payload && payload.error && payload.error.message) || ('HTTP ' + res.status));
      err.status = res.status;
      err.code = (payload && payload.error && payload.error.code) || '';
      throw err;
    }
    return payload || { data: null };
  } finally {
    if (timer) clearTimeout(timer);
  }
}

/* Signing out drops the token and anything still queued for the server, and
   deliberately leaves S alone: the student's progress belongs to the device
   too, and wiping it here would punish someone for logging out. */
function forceSignOut(announce) {
  lsDel(TOKEN_KEY); lsDel(USER_KEY); lsDel(QUEUE_KEY);
  // Classmates' names belong to the signed-in session only. Same for a
  // teacher's roster and a principal's school numbers: both are other
  // people's data, and neither may survive the account they came from.
  try { liveBoard = null; } catch {}
  try { teacherClasses = null; selectedClassCode = ''; classRosters = {}; } catch {}
  try { schoolStats = null; } catch {}
  clearTimeout(flushTimer);
  if (announce) toast(t('cloudSignedOutMsg'));
  try { if (S.onboarded && currentRoute() === 'profile') render(); } catch {}
}

/* ------------------------------------------------------------ event queue */

function readQueue() {
  try {
    const arr = JSON.parse(lsGet(QUEUE_KEY) || '[]');
    return Array.isArray(arr) ? arr : [];
  } catch { return []; }
}
function writeQueue(q) { lsSet(QUEUE_KEY, JSON.stringify(q.slice(-QUEUE_MAX))); }

let flushTimer = null;
let flushing = false;

/* Fire-and-forget. Never awaited by a click handler, never blocks a render. */
function pushEvent(kind, payload) {
  try {
    if (!signedIn()) return;          // guest: not queued at all, so nothing can pile up
    const q = readQueue();
    q.push({ kind, payload: payload || {}, ts: Date.now() });
    writeQueue(q);
    clearTimeout(flushTimer);
    flushTimer = setTimeout(() => { flushQueue(); }, FLUSH_DEBOUNCE_MS);
  } catch {}
}

async function flushQueue() {
  if (flushing || !signedIn()) return;
  if (navigator.onLine === false) return;   // the 'online' listener will call back
  flushing = true;
  try {
    // Bounded: a localStorage that silently refuses writes would otherwise
    // turn "drain the queue" into an endless request loop.
    for (let guard = 0; guard < 12; guard++) {
      if (!signedIn()) break;
      const pending = readQueue();
      if (!pending.length) break;
      const batch = pending.slice(0, EVENTS_PER_CALL);
      let out = null;
      try {
        out = await api('/journey/events', {
          method: 'POST',
          body: { events: batch.map(e => ({ kind: e.kind, payload: e.payload || {} })) }
        });
      } catch { break; }   // offline or server trouble: keep everything, retry later
      // Re-read rather than reuse `pending`: more events may have been queued
      // while this batch was in flight, and they must not be dropped.
      writeQueue(readQueue().slice(batch.length));
      adoptProfile(out && out.data && out.data.profile);
    }
  } catch {} finally { flushing = false; }
}

/* The server's profile replaces the local one wherever it has an opinion.
   New badges in the response are adopted silently: the local badge check
   already ran its takeover animation when the student earned it, and
   celebrating the same badge twice reads as a bug. */
function adoptProfile(p) {
  if (!p || typeof p !== 'object') return false;
  try {
    if (typeof p.xp === 'number') S.xp = p.xp;
    if (typeof p.streak === 'number') S.streak = p.streak;
    if (typeof p.longestStreak === 'number') S.best = p.longestStreak;
    if (typeof p.questsDone === 'number') S.quests = p.questsDone;
    if (typeof p.questDoneToday === 'boolean') S.questDoneOn = p.questDoneToday ? new Date().toDateString() : '';
    if (Array.isArray(p.toolsSeen)) S.toolsSeen = p.toolsSeen.slice();
    if (p.toolScores && typeof p.toolScores === 'object') S.toolScores = { ...p.toolScores };
    if (Array.isArray(p.chaptersUsed)) S.chaptersUsed = p.chaptersUsed.slice();
    if (Array.isArray(p.promptTemplatesUsed)) S.promptTemplatesUsed = p.promptTemplatesUsed.slice();
    if (Array.isArray(p.starterDone)) S.starterDone = p.starterDone.slice();
    if (Array.isArray(p.teacherModulesDone)) S.teacherModulesDone = p.teacherModulesDone.slice();
    // Union, server first: a badge earned locally seconds ago may not have
    // reached the server yet, and a badge must never visibly un-earn itself.
    if (Array.isArray(p.badges)) S.badges = p.badges.concat((S.badges || []).filter(k => !p.badges.includes(k)));
    if (p.badgeDates && typeof p.badgeDates === 'object') S.badgeDates = { ...S.badgeDates, ...p.badgeDates };
    if (typeof p.classCode === 'string') S.classCode = p.classCode;
    if (p.classGroup && CLASS_GROUPS[p.classGroup]) S.classGroup = p.classGroup;
    if (typeof p.avatar === 'string' && AVATARS.some(a => a.k === p.avatar)) S.avatar = p.avatar;
    if (p.locale === 'en' || p.locale === 'hi') S.locale = p.locale;
    save();
    return true;
  } catch { return false; }
}

/* --------------------------------------------------------------- hydrate */

/* Never blocks first paint: render() has already drawn the local state by the
   time this resolves, so a slow network costs a late re-render, not a blank
   screen. */
async function hydrateFromServer() {
  if (!signedIn()) return false;
  try {
    const out = await api('/journey/me');
    const d = out && out.data;
    if (!d) return false;
    adoptProfile(d.profile);
    if (Array.isArray(d.creations)) {
      S.creations = d.creations.map(c => ({
        id: String(c.id),
        title: String(c.title || ''),
        tool: String(c.tool || ''),
        link: String(c.link || ''),
        note: String(c.note || ''),
        emoji: c.emoji || CREATION_EMOJI[0],
        ts: Number(c.ts) || Date.now()
      }));
    }
    if (Array.isArray(d.timeline)) {
      S.timeline = d.timeline.slice(-TIMELINE_MAX).map(e => ({
        k: String(e.k || ''), l: String(e.l || ''),
        ts: Number(e.ts) || Date.now(), m: String(e.m || '')
      }));
    }
    save();
    render();
    return true;
  } catch { return false; }
}

/* ------------------------------------------------------ creations + onboard */

/* Creations are posted directly instead of queued: the server hands back the
   real id, and a locally-invented id that later disagrees with the server is
   how duplicate portfolio entries happen. A failed post keeps the local copy
   exactly as a guest would have it — nothing is lost, it just is not on the
   server yet. */
async function syncCreation(local) {
  if (!signedIn() || !local) return;
  try {
    const out = await api('/journey/creations', {
      method: 'POST',
      body: {
        title: local.title, tool: local.tool || '',
        link: local.link || '', note: local.note || '', emoji: local.emoji || ''
      }
    });
    const d = out && out.data;
    if (!d || !d.creation) return;
    const i = S.creations.findIndex(c => c.id === local.id);
    if (i >= 0) {
      S.creations[i] = {
        ...S.creations[i], ...d.creation,
        id: String(d.creation.id),
        ts: Number(d.creation.ts) || S.creations[i].ts
      };
    }
    adoptProfile(d.profile);
    save();
    if (currentRoute() === 'creations') render();
  } catch {}
}

function syncCreationDeleted(id) {
  if (!signedIn() || !id) return;
  try { api('/journey/creations/' + encodeURIComponent(id), { method: 'DELETE' }).catch(() => {}); } catch {}
}

/* `skipClassCode` exists for the onboarding path: /journey/onboard stores
   whatever code it is handed without checking it against a real class, so a
   student who typed a guess would end up parked in a class that does not
   exist. Onboarding therefore syncs everything else first and puts the code
   through the validated class_join event instead. */
async function syncOnboard(opts) {
  if (!signedIn()) return;
  try {
    const body = {
      journeyRole: S.role || 'student',
      classGroup: S.classGroup,
      avatar: S.avatar,
      locale: S.locale
    };
    if (S.classCode && !(opts && opts.skipClassCode)) body.classCode = S.classCode;
    if (S.name) body.name = S.name;
    const out = await api('/journey/onboard', { method: 'POST', body });
    const d = (out && out.data) || {};
    adoptProfile(d.profile);
    // The server drops a classCode it cannot find rather than storing a code
    // that points nowhere. It used to do so silently, leaving the student
    // holding a class chip the server had already thrown away.
    if (d.classCodeRejected) {
      S.classCode = '';
      save();
      toast('🏫 ' + t('classCodeNotFound'));
    }
  } catch {}
}

/* Joining a class, for a signed-in student, is the one place the app waits on
   the server before believing itself: the code is a shared secret a teacher
   read out, and a typo used to leave the student sitting in a class that was
   never real, wondering why the board stayed empty. The server answers with
   accepted:0 for a code it does not recognise.

   `accepted` is also 0 when the student is already in that class (the server
   has nothing to change), which is why the returned profile is checked too —
   re-entering your own code is a no-op, not a failure.

   Three outcomes, never two: 'ok' (in the class), 'rejected' (the server
   looked and said no) and 'offline' (the server never answered at all).
   Collapsing the last two into one is how a dropped connection ended up
   telling a student their teacher's code was fake. */
async function joinClassCloud(code, quiet) {
  let out = null;
  try {
    out = await api('/journey/events', {
      method: 'POST',
      body: { events: [{ kind: 'class_join', payload: { code } }] }
    });
  } catch {
    // A timeout, an abort, a 5xx, a captive portal: no verdict was reached,
    // so nothing here is allowed to look like "wrong code". Only a real 2xx
    // answer below is ever permitted to reject one.
    toast('☁️ ' + t('cloudOffline'));
    return 'offline';
  }
  const d = (out && out.data) || {};
  const p = d.profile;
  const accepted = Number(d && d.accepted) || 0;
  const inClass = !!(p && typeof p.classCode === 'string'
    && p.classCode.toLowerCase() === String(code).toLowerCase());
  if (accepted === 0 && !inClass) {
    toast('🏫 ' + t('classCodeNotFound'));
    haptic(60);
    return 'rejected';
  }
  // Captured before the server's profile lands: the join XP arrives inside
  // adoptProfile, so comparing after the fact is the only way to know a
  // level was crossed. The guest path gets this free from gain().
  const lvlBefore = levelForXp(S.xp);
  adoptProfile(p);
  save();
  if (!quiet) {
    if (d.awardedXP > 0) { toast(`+${d.awardedXP} XP · ${t('joinClass')}`); chime([659.25]); }
    else toast('🏫 ' + t('classJoined'));
    haptic(18);
    const lvlAfter = levelForXp(S.xp);
    const fresh = (Array.isArray(d.newBadges) ? d.newBadges : [])
      .map(k => BADGES.find(b => b.k === k))
      .filter(Boolean);
    if (lvlAfter > lvlBefore) queueTakeover(lvlAfter, fresh);
    else if (fresh.length) queueTakeover(null, fresh);
  }
  return 'ok';
}

/* Onboarding variant: the profile sync has to land first (so the server's XP
   already includes the welcome bonus before class_join adds to it). A code the
   server actually rejected is dropped locally; a code that merely could not be
   checked is kept and queued, because a student on school wifi should not
   finish onboarding with their class silently deleted. */
async function verifyOnboardClassCode() {
  const code = S.classCode;
  if (!signedIn() || !code) { syncOnboard(); return; }
  await syncOnboard({ skipClassCode: true });
  const r = await joinClassCloud(code, true);
  if (r === 'offline') {
    // Unverified, not wrong: the queue carries it until the network returns.
    pushEvent('class_join', { code });
    return;
  }
  if (r === 'rejected') {
    S.classCode = '';
    save();
    try { render(); } catch {}
  }
}

/* --------------------------------------------------------------- backfill */

/* A student can use this app for weeks before anyone hands them an account.
   The first sign-in replays that history to the server as ordinary events —
   the server dedupes, so replaying is safe, but posting creations is not
   idempotent, which is why this runs at most once per account per device. */
function backfillAlreadyRan(uid) {
  try {
    const list = JSON.parse(lsGet(BACKFILL_KEY) || '[]');
    return Array.isArray(list) && list.includes(uid);
  } catch { return false; }
}
function markBackfilled(uid) {
  try {
    const list = JSON.parse(lsGet(BACKFILL_KEY) || '[]');
    lsSet(BACKFILL_KEY, JSON.stringify((Array.isArray(list) ? list : []).concat([uid]).slice(-20)));
  } catch {}
}

async function backfillToServer() {
  const user = authUser();
  const uid = user && (user.id || user.email);
  if (!signedIn() || !uid || backfillAlreadyRan(uid)) return;
  markBackfilled(uid);  // marked up front: a half-finished run must not double-post creations

  const events = [];
  const add = (kind, payload) => events.push({ kind, payload });
  try {
    (S.toolsSeen || []).forEach(slug => add('tool_explored', { slug }));
    Object.keys(S.toolScores || {}).forEach(slug => {
      add('quiz_completed', { slug, pct: Math.max(0, Math.min(100, Math.round(Number(S.toolScores[slug]) || 0))) });
    });
    (S.chaptersUsed || []).forEach(slug => add('curriculum_prompt', { chapterSlug: slug }));
    (S.promptTemplatesUsed || []).forEach(key => add('prompt_built', { tplKey: key }));
    (S.starterDone || []).forEach(key => add('starter_step', { key }));
    (S.teacherModulesDone || []).forEach(key => add('upskill_module', { key }));
    if (S.classCode) add('class_join', { code: S.classCode });

    for (let i = 0; i < events.length; i += EVENTS_PER_CALL) {
      try {
        await api('/journey/events', { method: 'POST', body: { events: events.slice(i, i + EVENTS_PER_CALL) } });
      } catch {}   // one lost batch must not abandon the rest of a student's history
    }
    for (const c of (S.creations || [])) {
      try {
        await api('/journey/creations', {
          method: 'POST',
          body: { title: c.title, tool: c.tool || '', link: c.link || '', note: c.note || '', emoji: c.emoji || '' }
        });
      } catch {}
    }
    await syncOnboard();
  } catch {}
}

/* ------------------------------------------------------------------- auth */

async function cloudLogin(email, password) {
  const out = await api('/auth/login', { method: 'POST', auth: false, body: { email, password } });
  const d = out && out.data;
  if (!d || !d.token) throw new Error('login returned no token');
  lsSet(TOKEN_KEY, d.token);
  lsSet(USER_KEY, JSON.stringify({ id: d.id || '', email: d.email || email, name: d.name || '' }));
  if (d.name && !S.name) { S.name = d.name; save(); }
  return d;
}

async function cloudRegister(name, email, password) {
  await api('/auth/register', { method: 'POST', auth: false, body: { name, email, password } });
  return cloudLogin(email, password);   // register does not return a token by contract
}

async function afterSignedIn() {
  await backfillToServer();
  await flushQueue();
  await hydrateFromServer();
  render();
}

function bootSync() {
  try {
    addEventListener('online', () => { flushQueue(); });
    if (!signedIn()) return;
    flushQueue().then(() => hydrateFromServer()).catch(() => {});
  } catch {}
}

function ctx() {
  return {
    tools: S.toolsSeen.length,
    mastered: Object.values(S.toolScores).filter(p => p >= 80).length,
    perfect: Object.values(S.toolScores).filter(p => p === 100).length,
    streak: S.streak, level: levelForXp(S.xp), quests: S.quests, inClass: !!S.classCode,
    chapters: S.chaptersUsed.length,
    catsUsed: new Set(S.toolsSeen.map(slug => TOOL_BY_SLUG.get(slug)?.cat).filter(Boolean)).size,
    promptTemplates: S.promptTemplatesUsed.length,
    creations: S.creations.length,
    starter: S.starterDone.length
  };
}

/* Chrome logs a console error (not an exception) for vibrate() before the
   first user gesture, so the try/catch alone can't keep the console clean. */
let hadUserGesture = false;
try { addEventListener('pointerdown', () => { hadUserGesture = true; }, { once: true, passive: true }); } catch {}
function haptic(ms = 12) { if (!hadUserGesture) return; try { navigator.vibrate?.(ms); } catch {} }

function chime(freqs) {
  if (!S.sound || reduced()) return;
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ac = new Ctx();
    freqs.forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      const t0 = ac.currentTime + i * 0.11;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.16, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.32);
      o.connect(g).connect(ac.destination); o.start(t0); o.stop(t0 + 0.36);
    });
  } catch {}
}

function toast(msg) {
  const n = $('#toast');
  if (!n) return;
  n.textContent = msg; n.classList.add('on');
  clearTimeout(n._t); n._t = setTimeout(() => n.classList.remove('on'), 2300);
}

/* The clipboard is the one thing this app asks a student to do outside it:
   copy a prompt, paste it into an AI tool. It also fails routinely and
   silently — no permission, an insecure origin (a school intranet on plain
   http), an older WebView. Every call site used to fire the "Copied!" toast
   unconditionally, so a student whose clipboard was empty went to the tool,
   pasted nothing, and had no reason to suspect the app. Resolving to a
   boolean makes the toast follow what actually happened. */
function copyText(s) {
  return (navigator.clipboard && navigator.clipboard.writeText
    ? navigator.clipboard.writeText(s)
    : Promise.reject()).then(() => true).catch(() => false);
}

function countTo(node, from, to, dur = 850) {
  if (!node) return;
  if (reduced()) { node.textContent = to.toLocaleString(); return; }
  const t0 = performance.now();
  const step = now => {
    const p = Math.min(1, (now - t0) / dur);
    node.textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - p, 3))).toLocaleString();
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function confetti() {
  if (reduced()) return;
  const cv = $('#confetti'); if (!cv) return;
  cv.classList.add('on');
  const c = cv.getContext('2d');
  cv.width = innerWidth; cv.height = innerHeight;
  const cols = ['#ffc93c', '#ff6b35', '#2bd97c', '#7c3aed', '#38bdf8'];
  const bits = Array.from({ length: 120 }, () => ({
    x: innerWidth / 2 + (Math.random() - 0.5) * 180, y: innerHeight / 2,
    vx: (Math.random() - 0.5) * 13, vy: Math.random() * -15 - 4,
    s: 5 + Math.random() * 7, c: cols[(Math.random() * cols.length) | 0],
    r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.34
  }));
  let f = 0;
  (function loop() {
    c.clearRect(0, 0, cv.width, cv.height);
    bits.forEach(b => {
      b.vy += 0.42; b.x += b.vx; b.y += b.vy; b.r += b.vr;
      c.save(); c.translate(b.x, b.y); c.rotate(b.r);
      c.fillStyle = b.c; c.fillRect(-b.s / 2, -b.s / 2, b.s, b.s * 0.6); c.restore();
    });
    if (++f < 175) requestAnimationFrame(loop);
    else { c.clearRect(0, 0, cv.width, cv.height); cv.classList.remove('on'); }
  })();
}

/* Reveal-on-scroll. If the browser has no IntersectionObserver — some of the
   older machines in a school computer lab genuinely do not — everything is
   simply shown at once. A missing nicety must never cost a student content. */
const io = typeof IntersectionObserver === 'function'
  ? new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
    }, { rootMargin: '0px 0px -40px 0px', threshold: 0.05 })
  : null;
const observeReveals = root => root.querySelectorAll('.reveal:not(.in)')
  .forEach(n => io ? io.observe(n) : n.classList.add('in'));

/* ------------------------------------------------------------- XP awarding */


/* Capped, because this shares localStorage with the student's progress and a
   log that grew forever would eventually crowd out the thing it describes.
   Sixty entries is comfortably a full term of milestones. */
const TIMELINE_MAX = 60;

function logEvent(kind, label, meta) {
  if (S.role !== 'student') return;
  S.timeline = S.timeline || [];
  S.timeline.push({ k: kind, l: String(label), ts: Date.now(), m: meta ? String(meta) : '' });
  if (S.timeline.length > TIMELINE_MAX) S.timeline = S.timeline.slice(-TIMELINE_MAX);
  save();
}

function gain(amount, label) {
  const before = S.xp, lb = levelForXp(before);
  S.xp += amount;
  const la = levelForXp(S.xp);

  const fresh = BADGES.filter(b => !S.badges.includes(b.k) && b.need(ctx()));
  fresh.forEach(b => { S.badges.push(b.k); S.badgeDates[b.k] = Date.now(); logEvent('badge', L(b.n), b.e); });
  if (la > lb) logEvent('level', String(la), S.locale === 'hi' ? 'स्तर' : 'Level');
  save();

  toast(`+${amount} XP · ${label}`);
  haptic(18);
  chime([659.25]);

  if (la > lb) queueTakeover(la, fresh);
  else if (fresh.length) queueTakeover(null, fresh);

  return { leveled: la > lb, fresh };
}

/* ---------------------------------------------------- level-up / badge modal */

/* A student can trigger several XP events in a few seconds — opening three
   curriculum chapters back to back is a level-up and two badges. Firing
   independent setTimeouts for each would stack multiple celebration modals
   on top of each other and leave their typewriter intervals running after
   the modal is gone. This queue shows them one at a time instead. */
let takeoverQueue = [];
let takeoverActive = false;

function queueTakeover(level, badges) {
  takeoverQueue.push({ level, badges });
  setTimeout(advanceTakeoverQueue, 620);
}

function advanceTakeoverQueue() {
  if (takeoverActive || !takeoverQueue.length) return;
  const next = takeoverQueue.shift();
  takeoverActive = true;
  takeover(next.level, next.badges);
}

function takeover(level, badges) {
  const msg = level
    ? (S.locale === 'hi' ? `स्तर ${level}! अब आप ${groupTitleFor(level)[2]} हैं।` : `Level ${level}. You're a ${groupTitleFor(level)[1]} now.`)
    : (S.locale === 'hi' ? 'नया बैज मिला!' : 'New badge unlocked!');

  const over = el('div', 'over');
  over.setAttribute('role', 'dialog');
  over.setAttribute('aria-modal', 'true');
  over.innerHTML = `<div class="over__panel">
      <div class="over__voldy">${groupCfg().voldy}</div>
      <p class="over__msg" id="overMsg"></p>
      <ul class="over__badges">${(badges || []).map(b => `<li>${b.e} ${esc(L(b.n))}</li>`).join('')}</ul>
      <button class="btn btn--primary btn--block" style="margin-top:18px" id="overBtn">${esc(t('keepGoing'))}</button>
    </div>`;
  document.body.appendChild(over);

  const out = over.querySelector('#overMsg');
  let tick = null;
  if (reduced()) {
    out.textContent = msg;
  } else {
    let i = 0;
    tick = setInterval(() => {
      // Defensive: if the modal was removed by some other path while this
      // was still ticking, stop instead of touching a detached node.
      if (!out.isConnected) { clearInterval(tick); return; }
      i++;
      out.innerHTML = esc(msg.slice(0, i)) + (i < msg.length ? '<span class="caret"></span>' : '');
      if (i >= msg.length) clearInterval(tick);
    }, 34);
  }

  if (level) { confetti(); chime([523.25, 783.99]); haptic(40); }

  // Focuses the one button inside and keeps Tab there; on close, focus goes
  // back to whatever the student was on when the level-up interrupted them.
  const releaseFocus = trapFocus(over.querySelector('.over__panel'));

  const close = () => {
    if (tick) clearInterval(tick);
    releaseFocus();
    over.remove();
    document.removeEventListener('keydown', onKey);
    openOverlayClosers = openOverlayClosers.filter(fn => fn !== close);
    takeoverActive = false;
    advanceTakeoverQueue();
  };
  const onKey = e => { if (e.key === 'Escape') close(); };
  over.querySelector('#overBtn').onclick = close;
  over.addEventListener('click', e => { if (e.target === over) close(); });
  document.addEventListener('keydown', onKey);
  openOverlayClosers.push(close);
}

/* ===========================================================================
   FOCUS CONTAINMENT for the two genuinely modal things here: the bottom
   sheet and the level-up takeover. Both already declare aria-modal, which is
   a promise to assistive tech that the rest of the page is inert — but Tab
   walked straight out of them into the page behind, so a keyboard or
   screen-reader student ended up operating a UI hidden under the scrim, with
   no way to tell where they were. Restoring focus on close matters just as
   much: a sheet that closes and leaves focus on <body> drops the student
   back at the top of the document, losing their place entirely.
   =========================================================================== */

const FOCUSABLE = 'a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';

/* Overlays stack (a tool sheet opens the guardrails sheet on top of itself),
   and only the topmost one may own the keyboard — otherwise the one
   underneath keeps yanking focus back out of the one the student is using. */
let focusTrapStack = [];

function trapFocus(container) {
  if (!container) return () => {};
  const previous = document.activeElement;
  focusTrapStack.push(container);

  // Recomputed per keypress, never cached: sheet bodies are re-rendered in
  // place (Voldy swaps its whole question list for an answer), so a list
  // captured at open time would point at detached nodes.
  const items = () => Array.from(container.querySelectorAll(FOCUSABLE))
    .filter(n => !n.hidden && n.offsetParent !== null);

  const firstNow = items()[0];
  if (firstNow) { try { firstNow.focus(); } catch {} }

  const onKey = e => {
    if (e.key !== 'Tab') return;
    if (focusTrapStack[focusTrapStack.length - 1] !== container) return;
    const list = items();
    if (!list.length) return;
    const first = list[0], last = list[list.length - 1];
    if (!container.contains(document.activeElement)) { e.preventDefault(); first.focus(); return; }
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  };
  // Capture phase: the trap has to see Tab before anything inside the sheet
  // can stop its propagation.
  document.addEventListener('keydown', onKey, true);

  return () => {
    focusTrapStack = focusTrapStack.filter(c => c !== container);
    document.removeEventListener('keydown', onKey, true);
    // Only if it is still on the page — the element that opened the sheet is
    // often gone by now, destroyed by the re-render the sheet triggered.
    try { if (previous && previous.isConnected && previous.focus) previous.focus(); } catch {}
  };
}

function sheet(html, onMount) {
  const scrim = el('div', 'scrim');
  scrim.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="sheet__grab"></div>${html}</div>`;
  document.body.appendChild(scrim);
  // Before onMount, so a mount handler that focuses a specific field (the
  // creation title, the email box) still wins.
  const releaseFocus = trapFocus(scrim.querySelector('.sheet'));
  const close = () => {
    releaseFocus();
    scrim.remove();
    document.removeEventListener('keydown', onKey);
    openOverlayClosers = openOverlayClosers.filter(fn => fn !== close);
  };
  const onKey = e => { if (e.key === 'Escape') close(); };
  scrim.addEventListener('click', e => { if (e.target === scrim) close(); });
  document.addEventListener('keydown', onKey);
  openOverlayClosers.push(close);
  onMount?.(scrim.querySelector('.sheet'), close);
  return close;
}

const ROUTES = [
  'home', 'explore', 'curriculum', 'prompts', 'creations', 'search', 'voyage', 'badges', 'board', 'profile', 'quiz',
  'teacher', 'live', 'magic', 'upskill', 'planner', 'papers',
  'principal', 'journey', 'flags', 'coverage', 'coverageHeat', 'reports',
  'parent', 'family'
];
let quizArg = null;

function go(route, arg) {
  quizArg = arg ?? null;
