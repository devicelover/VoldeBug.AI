<!-- Fonts are served from this origin rather than a third-party CDN, for
     three reasons in order of weight: a school network that blocks or
     throttles that CDN would silently fall back to system fonts and break
     the type scale; a service worker can only precache same-origin assets,
     so this is what makes the app render correctly offline; and nobody
     outside this origin learns which student opened the app. The @font-face
     rules stay in their own file because they point at /app/fonts/*.woff2,
     which cannot be inlined the way the CSS and JS below are. -->
<link rel="stylesheet" href="/app/fonts.css"/>

<style>/* ===========================================================================
   VOLDEBUG — AI Education Portal
   ---------------------------------------------------------------------------
   DESIGN DIRECTION: the exercise book.

   This app lives in the same bag as a student's notebook, so it is built to
   feel like a well-made one rather than a dashboard. Paper surfaces, not
   tinted page backgrounds. Fountain-pen navy, not near-black. The red
   margin rule is the signature, and it is structural rather than
   decorative: it marks where the student's own work begins, exactly as it
   does in a school exercise book.

   Colour still means something here, consistently, and students learn the
   vocabulary in a week without being taught it:

       volt (yellow)   = XP and progress          — highlighter
       margin (red)    = streaks, urgency, alerts — the correcting pen
       sprout (green)  = correct, complete        — the teacher's tick

   Each class band keeps its own accent (junior warm, middle violet,
   senior sky) layered on top of this shared paper foundation.

   Typography: Eczar + Mukta. Both were drawn for Devanagari-Latin harmony,
   which matters because half of this interface renders in Hindi — the
   previous pairing treated Devanagari as a fallback and it showed.
   =========================================================================== */

:root {
  /* --- ink --- */
  --ink: #131a33;
  --ink-2: #202a4d;

  /* --- band accent. A more saturated indigo: the previous violet was
     muted enough that primary actions read as secondary. --- */
  --violet: #5b4be8;
  --violet-soft: #9d93f5;
  --accent-2: #9333ea;   /* gradient partner — violet leans toward magenta */

  /* --- semantic marks, brightened to sit on cleaner surfaces --- */
  --volt: #ffc02e;        /* XP and progress */
  --volt-deep: #8a6000;   /* 5.05:1 as chip text (was 2.39) */
  --flame: #f4553f;       /* streaks and urgency */
  --flame-deep: #b82d19;   /* 5.53:1 (was 4.51) */
  --sprout: #16b374;      /* correct, complete */
  --sprout-deep: #0b7a4d;  /* 4.86:1 (was 3.95) */
  --sky: #2f92ea;
  --rose: #ef4363;

  /* --- surfaces. Moved off the beige paper: it read as dusty, and on a
     product meant to pull students in, "quiet" had tipped into "drab".
     These are crisp and very slightly cool, so colour sits brighter on
     them and white cards separate cleanly. --- */
  --surface: #ffffff;
  --surface-2: #f2f3f9;
  --page: #f6f7fc;
  --border: #e4e6f0;
  --rule: #e4e6f0;
  --margin-rule: #f4553f;
  --text: #171f3d;
  --dim: #5a6480;        /* 5.31:1 on the worst light surface (was 4.15) */

  --font-display: "Eczar", Georgia, serif;
  --font-body: "Mukta", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;

  /* Nudged up from 12/16: on a consumer app used mostly on phones, this
     reads current without returning to the inflatable 26px of the original. */
  --r-sm: 10px;
  --r: 14px;
  --r-lg: 20px;
  --pill: 999px;

  /* Tinted rather than grey. A neutral shadow on a cool surface looks like
     dirt; carrying a little of the page's own hue keeps depth clean. */
  --shadow: 0 1px 2px rgba(23, 31, 61, 0.05), 0 3px 10px rgba(23, 31, 61, 0.05);
  --shadow-lift: 0 6px 16px rgba(23, 31, 61, 0.10), 0 18px 40px rgba(23, 31, 61, 0.09);
  --shadow-accent: 0 6px 22px rgba(91, 75, 232, 0.28);

  --pop: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease: cubic-bezier(0.22, 0.61, 0.36, 1);

  --nav-w: 236px;
  --tabbar-h: 68px;
}

/* Dark mode reads as a slate desk rather than an inverted notebook: the
   paper metaphor does not survive inversion, so it is dropped honestly
   instead of being faked with dark beige. */
[data-theme="dark"] {
  --surface: #191d33;
  --surface-2: #141828;
  --page: #0d101d;
  --border: #2a3050;
  --rule: #2a3050;
  --text: #eceefb;
  --dim: #9aa3c4;
  --violet: #8b7dff;
  --violet-soft: #b3a9ff;
  --accent-2: #b07cff;
  --volt: #ffcb4a;
  --sprout: #2fd693;
  --flame: #ff7361;
  --shadow-accent: 0 6px 22px rgba(139, 125, 255, 0.3);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 2px 10px rgba(0, 0, 0, 0.3);
  --shadow-lift: 0 6px 18px rgba(0, 0, 0, 0.5), 0 16px 34px rgba(0, 0, 0, 0.45);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

body {
  font-family: var(--font-body);
  font-size: 16.5px;
  line-height: 1.62;
  font-feature-settings: "kern" 1;
  -webkit-font-smoothing: antialiased;
  background: var(--page);
  color: var(--text);
  transition: background 0.4s var(--ease), color 0.4s var(--ease);
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}

h1, h2, h3, h4 {
  font-family: var(--font-display);
  line-height: 1.16;
  font-weight: 700;
  letter-spacing: -0.011em;
}
button, input, select { font-family: inherit; font-size: inherit; color: inherit; }
button { border: none; background: none; cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2.5px solid var(--ink); outline-offset: 2px; border-radius: 6px; }
[data-theme="dark"] :focus-visible { outline-color: var(--sky); }
::selection { background: rgba(245, 183, 25, 0.42); color: var(--ink); }

/* Scrollbar — thin, themed, unobtrusive */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: var(--pill); border: 3px solid var(--page); }

/* ===========================================================================
   APP SHELL
   Desktop gets a persistent left rail; mobile gets a bottom tab bar. The
   breakpoint is 960px — below that a rail eats too much of the screen on the
   cheap Android handsets most of these students actually own.
   =========================================================================== */

.app { min-height: 100dvh; display: flex; }

.rail {
  display: none;
  width: var(--nav-w);
  flex-shrink: 0;
  position: sticky;
  top: 0;
  height: 100dvh;
  padding: 22px 14px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  flex-direction: column;
  gap: 6px;
  transition: background 0.4s var(--ease);
}

.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 22px;
  letter-spacing: -0.3px;
  padding: 6px 12px 20px;
}
.brand em { font-style: normal; color: var(--violet); }
.brand-bolt { display: inline-block; animation: bolt 4s ease-in-out infinite; }

.rail-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border-radius: var(--r);
  font-weight: 700;
  font-size: 16px;
  color: var(--dim);
  position: relative;
  transition: color 0.2s, background 0.2s;
}
.rail-item i { font-style: normal; display: grid; place-items: center; width: 24px; flex-shrink: 0; }
.rail-item:hover { background: var(--surface-2); color: var(--text); }
.rail-item.on { background: var(--surface-2); color: var(--text); }
.rail-item.on::before {
  content: "";
  position: absolute;
  left: 0; top: 18%;
  width: 4px; height: 64%;
  border-radius: var(--pill);
  background: var(--violet);
  animation: railmark 0.34s var(--pop);
}
.rail-foot { margin-top: auto; display: flex; gap: 8px; padding: 0 6px; }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
  padding: 10px 16px;
  padding-top: max(10px, env(safe-area-inset-top));
  display: flex;
  align-items: center;
  gap: 10px;
}
.topbar .brand { display: flex; padding: 0; font-size: 19px; }
.spacer { flex: 1; }

.content {
  flex: 1;
  padding: 18px 16px calc(var(--tabbar-h) + 28px);
  max-width: 940px;
  width: 100%;
  margin: 0 auto;
}

/* Bottom tab bar — mobile only */
.tabbar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 45;
  height: calc(var(--tabbar-h) + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(16px);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: stretch;
}
.tab {
  /* min-width:0 matters: without it a seven-item bar cannot shrink below the
     widest label, which pushed the whole page wider than the viewport and
     left a dead gutter beside every screen. */
  flex: 1 1 0;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: -0.01em;
  color: var(--dim);
  position: relative;
  transition: color 0.2s;
  min-height: 44px;
  padding: 0 2px;
}
.tab__label {
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.tab i { font-style: normal; display: grid; place-items: center; line-height: 1; transition: transform 0.3s var(--pop); }
.ico { display: block; }
/* The active tab thickens its stroke rather than changing size, so the row
   never shifts as you move between tabs. */
.tab.on .ico { stroke-width: 2.1; }
.rail-item.on .ico { stroke-width: 2.1; }
.tab.on { color: var(--violet); }
.tab.on i { transform: translateY(-2px); }
.tab.on::after {
  content: "";
  position: absolute;
  top: 0;
  width: 26px; height: 3px;
  border-radius: var(--pill);
  background: var(--violet);
  animation: tabmark 0.32s var(--pop);
}

@media (min-width: 960px) {
  .rail { display: flex; }
  .tabbar { display: none; }
  .topbar .brand { display: none; }
  .content { padding: 26px 30px 60px; }
}

/* On a phone the header was carrying a wordmark, three status chips and
   three icon buttons, which overflowed the viewport and left a dead gutter
   beside every screen. The tab bar already says which app this is, so the
   wordmark is the first thing to go, and the status chips tighten. */
@media (max-width: 600px) {
  .topbar { gap: 6px; padding: 8px 12px; padding-top: max(8px, env(safe-area-inset-top)); }
  .topbar .brand em, .topbar .brand { font-size: 0; }
  .topbar .brand .brand-bolt { font-size: 20px; }
  .topbar .chip { padding: 4px 9px; font-size: 12.5px; }
  .topbar .icon-btn { width: 34px; height: 34px; min-width: 34px; font-size: 15px; }
}
@media (max-width: 400px) {
  /* Below this the class-band emoji chip is the least load-bearing thing
     in the header — the band is already obvious from the whole interface. */
  .topbar .chip:first-of-type { display: none; }
}

/* ===========================================================================
   PRIMITIVES
   =========================================================================== */

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 20px;
  box-shadow: var(--shadow);
  transition: background 0.4s var(--ease), border-color 0.25s, transform 0.22s var(--pop), box-shadow 0.22s;
}

/* THE SIGNATURE — the margin rule.
   A hairline red line set in from the left edge, exactly where it falls in a
   school exercise book. It is structural: it appears on cards holding the
   student's own work or the day's task, and is absent on plain containers,
   so over time its presence itself tells you what kind of card you are
   looking at. */
.card--ruled { position: relative; padding-left: 30px; }
.card--ruled::before {
  content: '';
  position: absolute;
  left: 15px; top: 12px; bottom: 12px;
  width: 1.5px;
  background: var(--margin-rule);
  opacity: 0.55;
  border-radius: 2px;
}
[data-theme="dark"] .card--ruled::before { opacity: 0.75; }
.card--tap { cursor: pointer; text-align: left; width: 100%; }
.card--tap:hover { transform: translateY(-3px); box-shadow: var(--shadow-lift); border-color: var(--violet-soft); }
.card--tap:active { transform: translateY(0) scale(0.985); }

.btn {
  position: relative;
  border-radius: var(--r);
  padding: 13px 24px;
  font-family: var(--font-body);
  font-weight: 700;
  font-size: 16px;
  letter-spacing: 0.004em;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  min-height: 48px;
  border: 1px solid transparent;
  overflow: hidden;
  isolation: isolate;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition:
    transform 0.18s var(--pop),
    box-shadow 0.24s var(--ease),
    border-color 0.22s var(--ease),
    filter 0.22s var(--ease);
}

/* Dimension comes from a hairline of light along the top inside edge and a
   two-part shadow — a tight contact shadow that keeps the button sitting on
   the paper, plus a soft ambient one. That reads as a physical key without
   the 4px hard offset that made the old buttons look like toys. */
.btn::before {
  content: '';
  position: absolute; inset: 0;
  border-radius: inherit;
  background: linear-gradient(180deg, rgba(255,255,255,0.16), rgba(255,255,255,0) 45%);
  pointer-events: none;
  z-index: -1;
}

/* Press feedback radiating from the centre. Transform and opacity only, so
   it stays on the compositor on low-end classroom hardware. */
.btn::after {
  content: '';
  position: absolute; inset: 0;
  border-radius: inherit;
  background: currentColor;
  opacity: 0;
  transform: scale(0.35);
  transition: transform 0.45s var(--ease), opacity 0.45s var(--ease);
  pointer-events: none;
  z-index: -1;
}
.btn:active::after { opacity: 0.15; transform: scale(1); transition-duration: 0s, 0s; }

.btn:active { transform: translateY(1.5px) scale(0.99); }
.btn[disabled] {
  cursor: not-allowed; transform: none !important;
  background: var(--surface-2) !important;
  color: var(--dim) !important;
  border-color: var(--border) !important;
  box-shadow: none !important;
  opacity: 0.85;
}
.btn[disabled]::after, .btn[disabled]::before { display: none; }

/* --- Primary: the highlighter yellow --- */
.btn--primary {
  background: linear-gradient(135deg, #ffd45e 0%, var(--volt) 44%, #f59e0b 100%);
  color: var(--ink);
  border-color: #c99408;
  box-shadow:
    0 1px 1px rgba(22,34,59,.10),
    0 2px 6px rgba(200,150,10,.22);
}
.btn--primary:hover {
  transform: translateY(-2px);
  filter: brightness(1.03);
  box-shadow:
    0 1px 1px rgba(22,34,59,.10),
    0 6px 18px rgba(216,163,12,.42);
}
.btn--primary:active {
  box-shadow: 0 1px 1px rgba(22,34,59,.14), 0 1px 3px rgba(200,150,10,.3);
}

/* --- Violet: the band accent --- */
.btn--violet {
  background: var(--violet);
  /* A diagonal travel between the band accent and its partner hue, rather
     than a vertical light-to-dark shift. Diagonal because the eye reads a
     135deg ramp as depth, where a straight vertical one reads as a
     highlight sitting on top of a flat fill. */
  background: linear-gradient(135deg,
    color-mix(in srgb, var(--violet) 92%, #fff) 0%,
    var(--violet) 42%,
    color-mix(in srgb, var(--accent-2) 88%, var(--violet)) 100%);
  color: #fff;
  border-color: rgba(0,0,0,0.24);
  border-color: color-mix(in srgb, var(--violet) 68%, #000);
  box-shadow:
    0 1px 1px rgba(22,34,59,.12),
    0 2px 8px rgba(22,34,59,.16);
}
.btn--violet:hover {
  transform: translateY(-2px);
  filter: brightness(1.06);
  box-shadow:
    0 1px 1px rgba(22,34,59,.12),
    0 7px 20px rgba(22,34,59,.26);
  box-shadow:
    0 1px 1px rgba(22,34,59,.12),
    0 7px 20px color-mix(in srgb, var(--violet) 42%, transparent);
}
.btn--violet:active {
  box-shadow: 0 1px 1px rgba(22,34,59,.16), 0 1px 4px rgba(22,34,59,.2);
}

/* --- Ghost: quiet until touched --- */
.btn--ghost {
  background: var(--surface);
  color: var(--text);
  border-color: var(--border);
  box-shadow: 0 1px 1px rgba(22,34,59,.04);
}
.btn--ghost::before { display: none; }
.btn--ghost:hover {
  border-color: var(--violet);
  color: var(--violet);
  transform: translateY(-2px);
  box-shadow: 0 5px 14px rgba(22,34,59,.09);
}
.btn--ghost:active { box-shadow: 0 1px 2px rgba(22,34,59,.06); }

/* --- Done: a finished state, so it should not invite pressing --- */
.btn--done {
  background: rgba(31, 157, 99, 0.1);
  color: var(--sprout-deep);
  border-color: var(--sprout);
  cursor: default;
  box-shadow: none;
}
.btn--done::before, .btn--done::after { display: none; }
.btn--done:hover { transform: none; }
[data-theme="dark"] .btn--done { color: var(--sprout); }

.btn--block { width: 100%; }

.icon-btn {
  width: 40px; height: 40px;
  min-width: 40px;
  border-radius: var(--r-sm);
  background: var(--surface);
  border: 1px solid var(--border);
  display: grid;
  place-items: center;
  font-size: 18px;
  transition: transform 0.18s var(--pop), background 0.2s;
}
.icon-btn:hover { transform: translateY(-2px); }
.icon-btn:active { transform: scale(0.92); }
.icon-btn[aria-pressed="false"] { opacity: 0.42; }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--pill);
  padding: 5px 12px;
  font-size: 13.5px;
  font-weight: 700;
  white-space: nowrap;
}
.chip--flame { background: rgba(255, 107, 53, 0.13); border-color: rgba(255, 107, 53, 0.34); color: var(--flame-deep); }
[data-theme="dark"] .chip--flame { color: var(--flame); }
.chip--volt { background: rgba(255, 201, 60, 0.18); border-color: rgba(255, 201, 60, 0.42); color: var(--volt-deep); }
[data-theme="dark"] .chip--volt { color: var(--volt); }
.chip--sprout { background: rgba(43, 217, 124, 0.14); border-color: rgba(43, 217, 124, 0.36); color: var(--sprout-deep); }
[data-theme="dark"] .chip--sprout { color: var(--sprout); }
.chip--sky { background: rgba(56, 189, 248, 0.14); border-color: rgba(56, 189, 248, 0.36); color: #0b7fab; }
[data-theme="dark"] .chip--sky { color: var(--sky); }

.sec { margin-top: 28px; }
/* Title and its subtitle stack rather than sit inline. Inline worked in
   English by accident — the strings were long enough to wrap — but in Hindi
   they are shorter and collided on one line, which read as a run-on. */
.sec-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin-bottom: 14px; }
.sec-head h2 { font-size: 20px; font-weight: 700; flex: 1 1 100%; }
.sec-head p { color: var(--dim); font-size: 14.5px; font-weight: 500; flex: 1 1 100%; line-height: 1.45; }
.sec-head .spacer { flex: 1; }

/* Section eyebrow rule — a hairline that runs from the heading to the edge,
   like the rule under a chapter title in a textbook. Structural: it marks
   where one section of the page ends and the next begins. */
.sec-head--rule { border-bottom: 1px solid var(--border); padding-bottom: 9px; }

.muted { color: var(--dim); }
.mono { font-family: var(--font-mono); }

/* ===========================================================================
   VIEW TRANSITIONS + REVEAL
   Every motion here is transform/opacity only, so it stays on the compositor
   and does not drop frames on a budget Android device.
   =========================================================================== */

.view { animation: viewIn 0.42s var(--ease) both; }
.view--back { animation: viewInBack 0.42s var(--ease) both; }

.stagger > * { animation: cardIn 0.5s var(--ease) both; animation-delay: calc(var(--i, 0) * 55ms); }

.reveal { opacity: 0; transform: translateY(22px); transition: opacity 0.55s var(--ease), transform 0.55s var(--ease); }
.reveal.in { opacity: 1; transform: none; }

@keyframes viewIn { from { opacity: 0; transform: translateY(14px) scale(0.995); } }
@keyframes viewInBack { from { opacity: 0; transform: translateX(-18px); } }
@keyframes cardIn { from { opacity: 0; transform: translateY(16px); } }
@keyframes bolt { 0%, 88%, 100% { transform: none; } 92% { transform: rotate(-14deg) scale(1.16); } 96% { transform: rotate(9deg) scale(1.08); } }
@keyframes railmark { from { transform: scaleY(0); } }
@keyframes tabmark { from { transform: scaleX(0); } }
@keyframes bob { 50% { transform: translateY(-9px); } }
@keyframes blink { 50% { opacity: 0; } }
@keyframes pulseRing { 0% { transform: scale(1); opacity: 0.55; } 70% { transform: scale(2.3); opacity: 0; } 100% { transform: scale(2.3); opacity: 0; } }
@keyframes shimmer { 100% { background-position: 200% 0; } }
@keyframes popIn { from { opacity: 0; transform: scale(0.86); } }
@keyframes slideUp { from { opacity: 0; transform: translateY(40px); } }
@keyframes shake { 10%, 90% { transform: translateX(-2px); } 30%, 70% { transform: translateX(4px); } 50% { transform: translateX(-4px); } }

/* Skeletons — the app paints structure before data, like every good ed-tech
   app does, instead of flashing a spinner on a blank screen. */
.skel {
  background: linear-gradient(90deg, var(--border) 25%, var(--surface-2) 50%, var(--border) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.4s linear infinite;
  border-radius: var(--r-sm);
}

/* ===========================================================================
   HERO / LEVEL RING
   =========================================================================== */

.hero { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; }

.ring { position: relative; display: grid; place-items: center; width: 128px; height: 128px; flex-shrink: 0; }
.ring svg { position: absolute; inset: 0; transform: rotate(-90deg); overflow: visible; }
.ring__track { fill: none; stroke: var(--border); stroke-width: 11; }
.ring__fill { fill: none; stroke: url(#voltGrad); stroke-width: 11; stroke-linecap: round; transition: stroke-dashoffset 1s var(--pop); }
.ring__avatar { font-size: 52px; line-height: 1; user-select: none; transition: transform 0.3s var(--pop); }
.ring:hover .ring__avatar { transform: scale(1.08) rotate(-5deg); }
.ring__lv {
  position: absolute; bottom: -7px; left: 50%; transform: translateX(-50%);
  background: var(--ink); color: var(--volt);
  font-family: var(--font-mono); font-size: 14px; font-weight: 700;
  padding: 3px 12px; border-radius: var(--pill);
  border: 3px solid var(--surface); white-space: nowrap;
}
.ring__lv i { font-style: normal; opacity: 0.6; font-size: 0.76em; margin-right: 3px; }

.hero__body { flex: 1; min-width: 220px; }
.hero__hi { font-size: 27px; }
.hero__title { color: var(--dim); font-weight: 800; font-size: 15px; margin-bottom: 14px; }
.xpline { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
.xpline b { font-family: var(--font-mono); font-size: 24px; font-weight: 700; }
.xpline small { color: var(--dim); font-size: 15px; font-weight: 800; }

.bar { height: 13px; background: var(--border); border-radius: var(--pill); overflow: hidden; }
.bar__fill { height: 100%; border-radius: var(--pill); background: linear-gradient(90deg, var(--volt), var(--flame)); transition: width 1s var(--pop); }
.bar--thin { height: 8px; }
.bar--sprout .bar__fill { background: linear-gradient(90deg, var(--sprout), var(--sky)); }

/* Streak week strip */
.week { display: flex; gap: 6px; margin-top: 14px; }
.week__day {
  flex: 1; aspect-ratio: 1 / 1.15; max-width: 46px;
  border-radius: var(--r-sm); border: 1px solid var(--border);
  background: var(--surface-2);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 1px; font-size: 11px; font-weight: 800; color: var(--dim);
}
.week__day b { font-size: 15px; line-height: 1; }
.week__day.hit { background: rgba(255, 107, 53, 0.14); border-color: rgba(255, 107, 53, 0.4); color: var(--flame-deep); }
[data-theme="dark"] .week__day.hit { color: var(--flame); }
.week__day.today { border-color: var(--violet); border-width: 2px; }

/* Stat grid */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr)); gap: 12px; }
.stat { padding: 15px 16px; }
.stat__k { font-family: var(--font-mono); font-size: 25px; font-weight: 700; line-height: 1.1; }
.stat__l { font-size: 14px; color: var(--dim); font-weight: 700; margin-top: 1px; }

/* ===========================================================================
   MISSION
   =========================================================================== */

/* The day's task is the one deliberately dark surface in the interface —
   a card slipped between the pages. Flat ink rather than a gradient: the
   old purple ramp was the last thing still speaking the previous visual
   language, and it read as belonging to a different product. */
.mission {
  background: var(--ink);
  color: #fff;
  border-radius: var(--r-lg);
  padding: 22px 22px 22px 26px;
  display: flex; gap: 18px; align-items: center; flex-wrap: wrap;
  position: relative; overflow: hidden;
  box-shadow: var(--shadow);
}
.mission::before {
  content: '';
  position: absolute; left: 11px; top: 16px; bottom: 16px;
  width: 1.5px; border-radius: 2px;
  background: var(--volt); opacity: 0.7;
}
.mission::after {
  content: ""; position: absolute; top: -70px; right: -50px;
  width: 200px; height: 200px; border-radius: 50%;
  background: rgba(255, 255, 255, 0.06);
}
.mission__icon { font-size: 42px; line-height: 1; animation: bob 3.4s ease-in-out infinite; }
.mission__body { flex: 1; min-width: 200px; position: relative; }
.mission__eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: var(--volt); margin-bottom: 5px; }
.mission__title { font-size: 22px; color: #fff; margin-bottom: 4px; }
.mission__desc { font-size: 15px; opacity: 0.82; line-height: 1.5; }

/* ===========================================================================
   ROADMAP / TOOL PATH
   A path, not a grid: the vertical spine tells a student where they are and
   what comes next, which a flat grid of equal tiles cannot do.
   =========================================================================== */

.path { position: relative; padding-left: 34px; }
.path::before {
  content: ""; position: absolute; left: 13px; top: 12px; bottom: 12px;
  width: 3px; border-radius: var(--pill);
  background: linear-gradient(180deg, var(--sprout), var(--volt) 45%, var(--border) 46%);
}
.node { position: relative; margin-bottom: 12px; }
.node::before {
  content: ""; position: absolute; left: -27px; top: 24px;
  width: 15px; height: 15px; border-radius: 50%;
  background: var(--border); border: 3px solid var(--page);
  transition: background 0.3s, transform 0.3s var(--pop);
}
.node.done::before { background: var(--sprout); }
.node.next::before { background: var(--volt); }
.node.next { position: relative; }
.node.next::after {
  content: ''; position: absolute; left: -1px; top: 15px;
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--volt); pointer-events: none;
  animation: pulseRing 2.2s var(--ease) infinite;
  transform-origin: center;
}

.tool { display: flex; align-items: center; gap: 14px; padding: 15px 16px; }
.tool__emoji { font-size: 30px; line-height: 1; flex-shrink: 0; width: 46px; height: 46px; display: grid; place-items: center; background: var(--surface-2); border-radius: var(--r-sm); }
.tool__body { flex: 1; min-width: 0; }
.tool__name { font-family: var(--font-display); font-weight: 700; font-size: 17px; }
.tool__meta { font-size: 13px; color: var(--dim); font-weight: 700; }
.tool__go { font-size: 20px; color: var(--dim); flex-shrink: 0; transition: transform 0.2s var(--pop); }
.card--tap:hover .tool__go { transform: translateX(4px); color: var(--violet); }
.tool__mastery { margin-top: 7px; }

.cats { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 4px; scrollbar-width: none; }
.cats::-webkit-scrollbar { display: none; }
.cats .chip { cursor: pointer; transition: transform 0.16s var(--pop); }
.cats .chip:active { transform: scale(0.94); }
.cats .chip.on { background: var(--violet); border-color: var(--violet); color: #fff; }

/* ===========================================================================
   BADGES
   =========================================================================== */

.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 12px; }
.badge { perspective: 900px; }
.badge__inner { position: relative; transition: transform 0.75s var(--pop); transform-style: preserve-3d; }
.badge.flip .badge__inner { transform: rotateY(360deg); }
.badge__face {
  border-radius: var(--r); border: 1px solid var(--border);
  background: var(--surface); box-shadow: var(--shadow);
  padding: 15px 11px; text-align: center;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 6px; min-height: 146px;
}
.badge__emoji { font-size: 34px; line-height: 1; }
.badge__name { font-family: var(--font-display); font-weight: 700; font-size: 14px; line-height: 1.15; }
.badge__hint { font-size: 12px; color: var(--dim); font-weight: 600; line-height: 1.25; }
.badge.locked .badge__face { background: var(--surface-2); }
.badge.locked .badge__emoji { filter: grayscale(1); opacity: 0.36; }
.badge.locked .badge__name { color: var(--dim); }
.badge--rare .badge__face { border-color: var(--sky); }
.badge--epic .badge__face { border-color: var(--violet); }
.badge--legendary .badge__face { border-color: var(--volt); box-shadow: 0 0 0 1px var(--volt), var(--shadow); }
.badge.locked .badge__face { border-color: var(--border) !important; box-shadow: var(--shadow) !important; }
.badge__prog { width: 100%; margin-top: 2px; }

/* ===========================================================================
   LEADERBOARD
   =========================================================================== */

.board { padding: 8px; }
.row { display: flex; align-items: center; gap: 12px; padding: 11px 13px; border-radius: var(--r); animation: cardIn 0.45s var(--ease) both; animation-delay: calc(var(--i, 0) * 60ms); }
.row + .row { border-top: 1px solid var(--border); }
.row.me { background: rgba(255, 201, 60, 0.16); }
.row__rank { font-family: var(--font-mono); font-weight: 700; font-size: 16px; color: var(--dim); width: 30px; flex-shrink: 0; }
.row.me .row__rank { color: var(--volt-deep); }
[data-theme="dark"] .row.me .row__rank { color: var(--volt); }
.row__av { font-size: 25px; flex-shrink: 0; }
.row__name { flex: 1; font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row__xp { font-family: var(--font-mono); font-weight: 700; font-size: 15px; flex-shrink: 0; }

.segment { display: flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--pill); padding: 3px; gap: 3px; }
.segment button { flex: 1; min-width: 0; padding: 8px 16px; border-radius: var(--pill); font-weight: 800; font-size: 14px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: background 0.25s, color 0.25s; }

/* Equal-fill flex:1 reads well for 2-4 short items (the leaderboard's
   All-time/This-week toggle) but breaks down at 5: dividing the row equally
   squeezes every label to the same sliver regardless of how short it
   actually is, so "Build" gets crushed into "…" exactly as hard as
   "Examples" does. The Prompt Library segment sizes buttons to their own
   content instead and lets the row scroll for whatever doesn't fit — a
   short label like "Tools" just stays "Tools", full width, and only the
   overflow moves. Same underlying min-width:auto issue already fixed twice
   for the bottom tab bar; scoped here rather than changed globally so the
   2-item leaderboard segment keeps its even, filled look. */
.segment--scroll { overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.segment--scroll::-webkit-scrollbar { display: none; }
.segment--scroll button { flex: 0 0 auto; padding: 8px 13px; font-size: 13px; }
.segment button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

/* ===========================================================================
   QUIZ
   =========================================================================== */

.quiz__prog { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
.quiz__q { font-size: 22px; margin-bottom: 18px; }
.opt {
  display: flex; align-items: center; gap: 13px;
  width: 100%; text-align: left;
  padding: 15px 17px; margin-bottom: 10px;
  border-radius: var(--r); border: 2px solid var(--border);
  background: var(--surface); font-weight: 700; font-size: 16px;
  transition: transform 0.16s var(--pop), border-color 0.2s, background 0.2s;
  min-height: 56px;
}
.opt:hover:not(:disabled) { border-color: var(--violet-soft); transform: translateX(3px); }
.opt:active:not(:disabled) { transform: scale(0.985); }
.opt__key {
  width: 30px; height: 30px; flex-shrink: 0;
  border-radius: var(--r-sm); background: var(--surface-2);
  display: grid; place-items: center;
  font-family: var(--font-mono); font-weight: 700; font-size: 14px;
  border: 1px solid var(--border);
}
.opt.right { border-color: var(--sprout); background: rgba(43, 217, 124, 0.12); }
.opt.right .opt__key { background: var(--sprout); color: #fff; border-color: var(--sprout); }
.opt.wrong { border-color: var(--rose); background: rgba(244, 63, 94, 0.1); animation: shake 0.4s; }
.opt.wrong .opt__key { background: var(--rose); color: #fff; border-color: var(--rose); }
.opt:disabled { cursor: default; }

.explain {
  border-radius: var(--r); padding: 14px 16px; margin: 4px 0 16px;
  background: var(--surface-2); border: 1px solid var(--border);
  font-size: 15px; line-height: 1.5;
  animation: slideUp 0.35s var(--ease) both;
}
.explain b { font-family: var(--font-display); }

/* ===========================================================================
   ONBOARDING
   =========================================================================== */

.onb { min-height: 100dvh; display: grid; place-items: center; padding: 26px 18px; }
.onb__panel { width: min(500px, 100%); }
.onb__steps { display: flex; gap: 6px; margin-bottom: 24px; }
.onb__steps span { flex: 1; height: 5px; border-radius: var(--pill); background: var(--border); transition: background 0.4s var(--ease); }
.onb__steps span.on { background: var(--violet); }
.onb__voldy { font-size: 62px; text-align: center; line-height: 1; animation: bob 3s ease-in-out infinite; }
.onb h1 { font-size: 29px; text-align: center; margin: 12px 0 6px; }
.onb p.sub { text-align: center; color: var(--dim); font-weight: 600; margin-bottom: 24px; }

.picks { display: grid; gap: 11px; }
.picks--2 { grid-template-columns: 1fr 1fr; }
.pick {
  border-radius: var(--r); border: 2px solid var(--border); background: var(--surface);
  padding: 18px 14px; text-align: center; font-weight: 800;
  transition: transform 0.18s var(--pop), border-color 0.2s;
  display: flex; flex-direction: column; align-items: center; gap: 7px;
  min-height: 62px; justify-content: center;
}
.pick em { font-style: normal; font-size: 30px; line-height: 1; }
.pick:hover { transform: translateY(-3px); border-color: var(--violet-soft); }
.pick:active { transform: scale(0.96); }
.pick.on { border-color: var(--violet); background: rgba(124, 58, 237, 0.09); }

.avatars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.avatars .pick { padding: 12px 6px; font-size: 12px; min-height: 78px; }
.avatars .pick em { font-size: 30px; }

.field { margin-bottom: 14px; }
.field label { display: block; font-weight: 800; font-size: 14px; margin-bottom: 6px; }
.input {
  width: 100%; padding: 14px 16px; min-height: 50px;
  border-radius: var(--r); border: 2px solid var(--border);
  background: var(--surface); font-weight: 700; font-size: 17px;
  transition: border-color 0.2s;
}
.input:focus { border-color: var(--violet); outline: none; }
.input--code { font-family: var(--font-mono); letter-spacing: 5px; text-transform: uppercase; text-align: center; font-size: 22px; }
.field__err { color: var(--rose); font-size: 14px; font-weight: 700; margin-top: 5px; min-height: 20px; }

/* ===========================================================================
   TEACHER
   =========================================================================== */

.codebox {
  background: linear-gradient(135deg, var(--ink), var(--violet));
  color: #fff; border-radius: var(--r-lg); padding: 22px; text-align: center;
}
.codebox__label { font-size: 13px; font-weight: 900; letter-spacing: 1.4px; text-transform: uppercase; opacity: 0.72; }
.codebox__code { font-family: var(--font-mono); font-size: 40px; font-weight: 700; letter-spacing: 7px; margin: 6px 0 12px; }

.tbl { width: 100%; border-collapse: collapse; font-size: 15px; }
.tbl th { text-align: left; font-weight: 800; font-size: 13px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.6px; padding: 10px 12px; border-bottom: 1px solid var(--border); }
.tbl td { padding: 12px; border-bottom: 1px solid var(--border); }
.tbl tr:last-child td { border-bottom: none; }
.tbl__scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.tbl__name { display: flex; align-items: center; gap: 9px; font-weight: 700; white-space: nowrap; }

/* ===========================================================================
   MODALS / SHEETS
   On mobile a modal is a bottom sheet, because a centred dialog on a 5-inch
   screen puts the primary action under the user's thumb-shadow.
   =========================================================================== */

.scrim {
  position: fixed; inset: 0; z-index: 80;
  background: rgba(27, 20, 64, 0.62);
  backdrop-filter: blur(5px);
  display: flex; align-items: flex-end; justify-content: center;
  animation: fadeIn 0.24s var(--ease);
  padding: 0;
}
@keyframes fadeIn { from { opacity: 0; } }

.sheet {
  width: 100%; max-width: 540px;
  background: var(--surface);
  border-radius: var(--r-lg) var(--r-lg) 0 0;
  padding: 10px 20px calc(24px + env(safe-area-inset-bottom));
  max-height: 88dvh; overflow-y: auto;
  animation: slideUp 0.4s var(--pop) both;
}
.sheet__grab { width: 42px; height: 5px; border-radius: var(--pill); background: var(--border); margin: 4px auto 16px; }

@media (min-width: 640px) {
  .scrim { align-items: center; padding: 24px; }
  .sheet { border-radius: var(--r-lg); animation: popIn 0.34s var(--pop) both; }
  .sheet__grab { display: none; }
}

/* Level-up takeover */
.over { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; padding: 22px; background: rgba(27, 20, 64, 0.86); backdrop-filter: blur(7px); animation: fadeIn 0.22s; }
.over__panel { width: min(430px, 100%); background: var(--surface); border-radius: var(--r-lg); padding: 34px 26px 24px; text-align: center; animation: popIn 0.44s var(--pop) both; }
.over__voldy { font-size: 66px; line-height: 1; animation: bob 2.4s ease-in-out infinite; }
.over__msg { font-family: var(--font-display); font-size: 25px; font-weight: 700; margin-top: 14px; min-height: 2.5em; line-height: 1.3; }
.caret { display: inline-block; width: 3px; height: 0.95em; background: var(--violet); vertical-align: -0.1em; margin-left: 3px; animation: blink 0.9s steps(2, start) infinite; }
.over__badges { list-style: none; display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; margin-top: 12px; }
.over__badges li { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--pill); padding: 5px 13px; font-size: 14px; font-weight: 800; }

#confetti { position: fixed; inset: 0; z-index: 89; pointer-events: none; display: none; }
#confetti.on { display: block; }

.toast {
  position: fixed; left: 50%; z-index: 88;
  bottom: calc(var(--tabbar-h) + 18px + env(safe-area-inset-bottom));
  transform: translate(-50%, 16px);
  background: var(--ink); color: var(--volt);
  font-family: var(--font-mono); font-weight: 700; font-size: 15px;
  padding: 11px 20px; border-radius: var(--pill);
  opacity: 0; transition: opacity 0.28s, transform 0.28s var(--pop);
  pointer-events: none; max-width: calc(100vw - 32px); text-align: center;
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }
@media (min-width: 960px) { .toast { bottom: 28px; } }

/* Certificate */
.certwrap { background: var(--surface-2); border-radius: var(--r); padding: 12px; }
.certwrap canvas { width: 100%; height: auto; display: block; border-radius: var(--r-sm); box-shadow: var(--shadow); }

/* Demo-data notice — the audit flagged fake stats presented as real */
.demo-note {
  display: flex; align-items: center; gap: 8px;
  background: var(--surface-2); border: 1px dashed var(--border);
  border-radius: var(--r); padding: 8px 13px; font-size: 13px; font-weight: 600;
  color: var(--dim);
  margin-bottom: 16px;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
  .reveal { opacity: 1; transform: none; }
}

/* ===========================================================================
   CLASS GROUP THEMES
   Each group gets its own accent colour, font sizing, and personality layer.
   Everything is a CSS variable override on the html element, so every
   component in the app picks it up without knowing which group is active.
   =========================================================================== */

/* Each band changes its ACCENT and its type scale, not the paper. Tinting the
   page itself per band (the old approach) fought the shared paper foundation
   and made two of the three bands look washed out. The paper stays constant
   so the product reads as one product; the accent tells you who you are. */

/* JUNIOR — Nursery to Class 5
   Warm orange, larger type, softer corners, a little more motion. */
[data-group="junior"] {
  --violet: #e05a1f;
  --violet-soft: #f5a97f;
  --accent-2: #f59e0b;   /* orange leans toward amber */
  --r-sm: 10px;
  --r: 16px;
  --r-lg: 22px;
}
[data-group="junior"] body { font-size: 18.5px; line-height: 1.6; }
[data-group="junior"] h1, [data-group="junior"] h2 { font-size: 1.28em; }
[data-group="junior"] .onb h1 { font-size: 32px; }
[data-group="junior"] .btn { font-size: 18px; padding: 14px 24px; }
[data-group="junior"] .card { border-width: 1.5px; }
[data-group="junior"] .stat__k { font-size: 30px; }
[data-group="junior"] .mission__title { font-size: 23px; }
[data-group="junior"] .week__day { font-size: 13px; }
[data-group="junior"] .week__day b { font-size: 18px; }
[data-group="junior"] .brand-bolt { animation: bolt 2s ease-in-out infinite; }

/* SENIOR — Class 10 to 12
   Light blue, tighter type, a calmer and more adult register. The blue is
   the accent only; the paper is the same paper as everywhere else. */
[data-group="senior"] {
  --violet: #1f6fb2;
  --violet-soft: #6aa9dc;
  --accent-2: #22a2c9;   /* blue leans toward cyan */
  --r-sm: 6px;
  --r: 10px;
  --r-lg: 12px;
}
[data-theme="dark"][data-group="senior"] {
  --violet: #4d9fe0;
  --violet-soft: #8cc4ee;
  --accent-2: #4fc7e8;
}
[data-group="senior"] body { font-size: 16px; }
[data-group="senior"] .hero__hi { font-size: 21px; }
[data-group="senior"] .stat__k { font-size: 23px; }

/* MIDDLE — Class 6 to 9 uses the :root defaults unchanged. */

/* Onboarding pick card row layout (used in class group step) */
.pick.row-pick {
  flex-direction: row !important;
  text-align: left !important;
  gap: 14px !important;
  padding: 16px 18px !important;
  min-height: 72px !important;
  justify-content: flex-start !important;
}

/* ===========================================================================
   NEW MODULES — Change Request 25 July 2026
   Category grid, curriculum picker, magic tool cards, principal dashboard,
   flags, journey. Built on the existing card/chip/stat/tbl primitives above
   so nothing here introduces a second visual language.
   =========================================================================== */

/* ---- category landing grid (Section 4: "what do you want to make today") */
.cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.cat-tile { padding: 20px 16px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.cat-tile__emoji { font-size: 34px; line-height: 1; }
.cat-tile__name { font-family: var(--font-display); font-weight: 700; font-size: 15px; line-height: 1.2; }
.cat-tile__count { font-size: 12px; color: var(--dim); font-weight: 700; }

/* ---- breadcrumb bar (curriculum picker + tool category drill-down) */
.crumbs { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; font-size: 14px; font-weight: 700; }
.crumbs button { color: var(--violet); }
.crumbs button:hover { text-decoration: underline; }
.crumbs span.sep { color: var(--dim); }
.crumbs span.now { color: var(--dim); }

/* ---- simple pick-list (board / class / subject selectors) */
.pick-list { display: grid; gap: 10px; }
.pick-row {
  display: flex; align-items: center; gap: 12px; padding: 15px 16px;
  border-radius: var(--r); border: 1px solid var(--border); background: var(--surface);
  box-shadow: var(--shadow); text-align: left; width: 100%;
  transition: transform 0.16s var(--pop), border-color 0.2s;
}
.pick-row:hover { transform: translateY(-2px); border-color: var(--violet-soft); }
.pick-row__emoji { font-size: 24px; flex-shrink: 0; }
.pick-row__label { flex: 1; font-family: var(--font-display); font-weight: 700; font-size: 16px; }
.pick-row__meta { font-size: 13px; color: var(--dim); font-weight: 700; }
.pick-row__go { color: var(--dim); font-size: 18px; }

/* ---- chapter card (shows official textbook link + prompt set together) */
.chapter-card { padding: 18px; }
.chapter-card__title { font-family: var(--font-display); font-weight: 700; font-size: 18px; margin-bottom: 4px; }
.prompt-item {
  display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px;
  border-radius: var(--r-sm); background: var(--surface-2); border: 1px solid var(--border);
  margin-top: 10px;
}
.prompt-item__tool { font-size: 20px; flex-shrink: 0; }
.prompt-item__text { flex: 1; font-size: 14px; line-height: 1.5; }
.prompt-item__use { flex-shrink: 0; font-size: 13px; font-weight: 800; color: var(--violet); white-space: nowrap; }

/* ---- notice box (prototype honesty callouts — amber, not red: informational
   not alarming) */
.notice-box {
  display: flex; gap: 10px; padding: 13px 15px; border-radius: var(--r);
  background: rgba(255, 201, 60, 0.12); border: 1px dashed var(--volt-deep);
  font-size: 13px; line-height: 1.5; color: var(--text);
}
[data-theme="dark"] .notice-box { border-color: var(--volt); }
.notice-box__icon { flex-shrink: 0; font-size: 16px; }
.notice-box strong { font-family: var(--font-display); display: block; margin-bottom: 3px; }

/* ---- magic tool generator cards (teacher) */
.magic-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.magic-card { padding: 20px; }
.magic-card__head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.magic-card__emoji { font-size: 26px; }
.magic-card__title { font-family: var(--font-display); font-weight: 700; font-size: 17px; }
.magic-card__desc { font-size: 13px; color: var(--dim); font-weight: 600; margin-bottom: 14px; }
.magic-out {
  margin-top: 14px; padding: 14px; border-radius: var(--r-sm);
  background: var(--surface-2); border: 1px solid var(--border);
  font-size: 14px; line-height: 1.6; white-space: pre-wrap;
  max-height: 320px; overflow-y: auto;
  animation: slideUp 0.35s var(--ease) both;
}
.magic-out h4 { font-family: var(--font-display); font-size: 14px; margin: 10px 0 3px; }
.magic-out h4:first-child { margin-top: 0; }

/* ---- upskilling module list (teacher) */
.module-row { display: flex; align-items: center; gap: 14px; padding: 16px; }
.module-row__emoji { font-size: 26px; flex-shrink: 0; width: 42px; text-align: center; }
.module-row__body { flex: 1; min-width: 0; }
.module-row__title { font-family: var(--font-display); font-weight: 700; font-size: 16px; }
.module-row__meta { font-size: 13px; color: var(--dim); font-weight: 700; }

/* ---- principal: journey rows (per-class term trend) */
.journey-row { padding: 16px; margin-bottom: 10px; }
.journey-row__head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.journey-row__name { font-family: var(--font-display); font-weight: 700; font-size: 16px; flex: 1; }
.sparkline { display: flex; align-items: flex-end; gap: 3px; height: 40px; }
.sparkline__bar { flex: 1; background: linear-gradient(180deg, var(--volt), var(--flame)); border-radius: 3px 3px 0 0; min-height: 3px; }

/* ---- principal: flags (misuse alerts) */
.flag-item { display: flex; gap: 12px; padding: 14px 16px; align-items: flex-start; }
.flag-item__icon { font-size: 20px; flex-shrink: 0; }
.flag-item__body { flex: 1; min-width: 0; }
.flag-item__title { font-weight: 700; font-size: 14px; }
.flag-item__meta { font-size: 12px; color: var(--dim); font-weight: 700; margin-top: 2px; }
.flag-item--low { border-left: 3px solid var(--sky); }
.flag-item--med { border-left: 3px solid var(--volt-deep); }
.flag-item--high { border-left: 3px solid var(--rose); }
.flag-item.reviewed { opacity: 0.5; }

/* ---- guardrails badge, shown on tool sheets when opened from Curriculum */
.guard-chip {
  display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 800;
  background: rgba(43, 217, 124, 0.14); border: 1px solid rgba(43, 217, 124, 0.4);
  color: var(--sprout-deep); padding: 4px 10px; border-radius: var(--pill);
}
[data-theme="dark"] .guard-chip { color: var(--sprout); }
.guard-chip { cursor: pointer; transition: transform 0.16s var(--pop); }
.guard-chip:hover { transform: translateY(-1px); }
.guard-chip:active { transform: scale(0.96); }
.guard-chip::after { content: ' ⓘ'; opacity: 0.7; }

@media (max-width: 480px) {
  .cat-grid { grid-template-columns: repeat(2, 1fr); }
  .magic-grid { grid-template-columns: 1fr; }
}

/* ===========================================================================
   AI PROMPT LIBRARY
   The source document frames every copy-paste prompt as sitting in a "gold
   box" — that maps directly onto --volt, already the app's XP/reward colour,
   so a generated prompt reads as something earned, not just a text block.
   =========================================================================== */

.prompt-box {
  background: linear-gradient(135deg, rgba(255,201,60,.14), rgba(255,201,60,.05));
  border: 2px solid var(--volt);
  border-radius: var(--r);
  padding: 16px;
  position: relative;
}
.prompt-box__label {
  font-size: 11px; font-weight: 900; letter-spacing: 1.2px; text-transform: uppercase;
  color: var(--volt-deep); margin-bottom: 8px; display: flex; align-items: center; gap: 6px;
}
[data-theme="dark"] .prompt-box__label { color: var(--volt); }
.prompt-box__text { font-family: var(--font-mono); font-size: 14px; line-height: 1.6; white-space: pre-wrap; }
.prompt-box--empty { border-style: dashed; opacity: .6; }
.prompt-box--empty .prompt-box__text { font-family: var(--font-body); text-align: center; padding: 12px 0; }

.tpl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.tpl-tile { padding: 20px 16px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 7px; }
.tpl-tile__emoji { font-size: 32px; line-height: 1; }
.tpl-tile__name { font-family: var(--font-display); font-weight: 700; font-size: 14px; }

.tool-pill-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.tool-pill {
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--pill);
  padding: 8px 14px; font-size: 13px; font-weight: 700; text-decoration: none; color: var(--text);
  transition: transform .16s var(--pop), border-color .2s;
}
.tool-pill:hover { transform: translateY(-2px); border-color: var(--violet-soft); }
.tool-pill::after { content: '↗'; opacity: .5; font-size: 11px; }

.step-list { list-style: none; counter-reset: step; display: grid; gap: 10px; }
.step-list li { counter-increment: step; display: flex; gap: 12px; align-items: flex-start; font-size: 14px; font-weight: 600; }
.step-list li::before {
  content: counter(step); flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%;
  background: var(--violet); color: #fff; font-family: var(--font-mono); font-size: 12px; font-weight: 700;
  display: grid; place-items: center;
}

/* ---- tried-template checkmark on the picker grid ---- */
.tpl-tile { position: relative; }
.tpl-tile--done { border-color: var(--sprout); background: linear-gradient(180deg, rgba(43,217,124,.08), transparent); }
.tpl-tile__check {
  position: absolute; top: 8px; right: 8px; width: 20px; height: 20px; border-radius: 50%;
  background: var(--sprout); color: #fff; font-size: 11px; font-weight: 800;
  display: grid; place-items: center; animation: popIn 0.3s var(--pop) both;
}

/* ---- prompt box refresh pulse — plays once per genuine content change,
   since each update creates a fresh DOM node rather than mutating in place ---- */
.prompt-box--pulse { animation: promptPulse 0.5s var(--ease) both; }
@keyframes promptPulse {
  0% { transform: scale(0.98); box-shadow: 0 0 0 0 rgba(255,201,60,.5); }
  60% { box-shadow: 0 0 0 8px rgba(255,201,60,0); }
  100% { transform: scale(1); }
}

/* ---- segment content swap — brief fade so switching Build/Examples/Tools
   doesn't feel like a hard cut ---- */
.segment + * { animation: segFade 0.28s var(--ease) both; }
@keyframes segFade { from { opacity: 0; transform: translateY(6px); } }

/* ===========================================================================
   PRINCIPAL REPORTS + COVERAGE MAP
   =========================================================================== */

/* ---- coverage map ---- */
.cov-class { padding: 16px; margin-bottom: 12px; }
.cov-class__head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.cov-class__name { font-family: var(--font-display); font-weight: 700; font-size: 16px; flex: 1; }
.cov-row { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
.cov-row__name { font-size: 13px; font-weight: 700; width: 96px; flex-shrink: 0; }
.cov-row__bar { flex: 1; height: 9px; border-radius: 5px; background: var(--surface-2); overflow: hidden; position: relative; }
.cov-row__fill { height: 100%; border-radius: 5px; transition: width .5s var(--ease); }
.cov-row__fill--good { background: linear-gradient(90deg, var(--sprout), #4ade80); }
.cov-row__fill--mid  { background: linear-gradient(90deg, var(--volt-deep), var(--volt)); }
.cov-row__fill--low  { background: linear-gradient(90deg, #f87171, var(--rose)); }
.cov-row__num { font-family: var(--font-mono); font-size: 12px; font-weight: 700; color: var(--dim); width: 52px; text-align: right; flex-shrink: 0; }

/* ---- report document ---- */
.report-doc {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r);
  padding: 32px; box-shadow: var(--shadow);
}
.report-doc__head { text-align: center; border-bottom: 2px solid var(--border); padding-bottom: 18px; margin-bottom: 20px; }
.report-doc__logo { font-family: var(--font-display); font-weight: 800; font-size: 17px; color: var(--violet); letter-spacing: .5px; }
.report-doc__title { font-family: var(--font-display); font-weight: 800; font-size: 25px; margin: 8px 0 4px; }
.report-doc__meta { font-size: 13px; color: var(--dim); font-weight: 600; }
.report-doc h3 {
  font-family: var(--font-display); font-size: 15px; text-transform: uppercase; letter-spacing: 1px;
  color: var(--dim); margin: 22px 0 10px; padding-bottom: 5px; border-bottom: 1px solid var(--border);
}
.report-doc p { font-size: 14px; line-height: 1.65; }
.report-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 12px; margin: 14px 0; }
.report-stat { text-align: center; padding: 14px 8px; border-radius: var(--r-sm); background: var(--surface-2); }
.report-stat__k { font-family: var(--font-mono); font-size: 24px; font-weight: 700; color: var(--violet); }
.report-stat__l { font-size: 11px; font-weight: 700; color: var(--dim); text-transform: uppercase; letter-spacing: .5px; margin-top: 3px; }
.report-doc__foot { margin-top: 26px; padding-top: 14px; border-top: 1px solid var(--border); font-size: 12px; color: var(--dim); text-align: center; }

.sample-banner {
  background: rgba(255,107,53,.12); border: 2px dashed var(--flame); border-radius: var(--r-sm);
  padding: 11px 14px; font-size: 12px; font-weight: 800; color: var(--flame-deep);
  text-align: center; margin-bottom: 18px; letter-spacing: .3px;
}
[data-theme="dark"] .sample-banner { color: #fca5a5; }

/* ---- print: the whole point of a "printable" report. Strip the app shell
   so what comes out of the printer is the document, not a screenshot of a
   web app. Forced to light colours because dark-mode backgrounds waste
   toner and render illegibly on paper. ---- */
@media print {
  .rail, .tabbar, .topbar, .demo-note, .no-print { display: none !important; }
  .app, .main, .content { display: block !important; padding: 0 !important; margin: 0 !important; }
  .view { padding: 0 !important; }
  body, .report-doc { background: #fff !important; color: #000 !important; box-shadow: none !important; }
  .report-doc { border: none !important; padding: 0 !important; }
  .report-doc__logo, .report-stat__k { color: #000 !important; }
  /* Section labels sit at --dim on screen, which prints too faint to scan. */
  .report-doc h3 { color: #000 !important; border-bottom-color: #999 !important; }
  .report-doc__meta, .report-doc__foot { color: #333 !important; }
  .report-stat { background: #f4f4f4 !important; }
  .sample-banner { border-color: #000 !important; color: #000 !important; background: #fff !important; }
  .cov-row__fill--good, .cov-row__fill--mid, .cov-row__fill--low { background: #666 !important; }
  a[href]::after { content: '' !important; }
  @page { margin: 16mm; }
}

/* ===========================================================================
   MY CREATIONS / PROMPT HISTORY / UNIVERSAL SEARCH
   =========================================================================== */

/* ---- creations portfolio ---- */
.creation-card { padding: 16px; margin-bottom: 12px; display: flex; gap: 13px; align-items: flex-start; }
.creation-card__emoji { font-size: 28px; flex-shrink: 0; line-height: 1; }
.creation-card__body { flex: 1; min-width: 0; }
.creation-card__title { font-family: var(--font-display); font-weight: 700; font-size: 16px; line-height: 1.25; }
.creation-card__meta { font-size: 12px; color: var(--dim); font-weight: 700; margin-top: 3px; }
.creation-card__note { font-size: 13px; line-height: 1.5; margin-top: 7px; color: var(--text); opacity: .82; }
.creation-card__actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.creation-card__actions a, .creation-card__actions button {
  font-size: 12px; font-weight: 800; padding: 6px 12px; border-radius: var(--pill);
  border: 1px solid var(--border); background: var(--surface-2); color: var(--text); text-decoration: none;
}
.creation-card__actions a:hover { border-color: var(--violet-soft); }
.creation-card__actions .danger { color: var(--rose); }

.empty-state { text-align: center; padding: 40px 20px; }
.empty-state__emoji { font-size: 52px; line-height: 1; }
.empty-state__title { font-family: var(--font-display); font-weight: 700; font-size: 19px; margin-top: 12px; }
.empty-state__sub { font-size: 14px; color: var(--dim); font-weight: 600; margin-top: 6px; max-width: 320px; margin-inline: auto; line-height: 1.5; }

/* ---- prompt history ---- */
.hist-item { padding: 14px 16px; margin-bottom: 10px; }
.hist-item__head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.hist-item__type { font-size: 12px; font-weight: 800; color: var(--violet); }
.hist-item__when { font-size: 11px; color: var(--dim); font-weight: 700; margin-left: auto; }
.hist-item__text {
  font-family: var(--font-mono); font-size: 12.5px; line-height: 1.55; color: var(--text); opacity: .8;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}

/* ---- universal search ---- */
.search-wrap { position: sticky; top: 0; z-index: 5; padding-bottom: 10px; background: var(--page); }
.res-group__label {
  font-size: 11px; font-weight: 900; letter-spacing: 1.2px; text-transform: uppercase;
  color: var(--dim); margin: 16px 0 8px;
}
.res-item { display: flex; align-items: center; gap: 12px; padding: 13px 15px; width: 100%; text-align: left; margin-bottom: 8px; }
.res-item__emoji { font-size: 22px; flex-shrink: 0; }
.res-item__body { flex: 1; min-width: 0; }
.res-item__title { font-family: var(--font-display); font-weight: 700; font-size: 15px; }
.res-item__meta { font-size: 12px; color: var(--dim); font-weight: 700; margin-top: 2px; }
.res-item mark { background: rgba(255,201,60,.45); color: inherit; border-radius: 3px; padding: 0 2px; }
[data-theme="dark"] .res-item mark { background: rgba(255,201,60,.3); }

/* ===========================================================================
   READABILITY PASS
   Lower overall contrast, calmer emoji, and a consistent vertical rhythm.
   The aim is a page that can be read for twenty minutes in a classroom
   without fatigue, not one that looks striking in a screenshot.
   =========================================================================== */

/* Emoji still carry meaning on tools, categories and avatars, but they were
   sized as headlines. At these sizes they sit beside the text as marks. */
.cat-tile__emoji { font-size: 27px; }
.tpl-tile__emoji { font-size: 26px; }
.tool__emoji { font-size: 25px; }
.creation-card__emoji { font-size: 23px; }
.res-item__emoji { font-size: 19px; }
.pick-row__emoji { font-size: 20px; }
.empty-state__emoji { font-size: 40px; opacity: .75; }

/* Secondary text sat at the same weight as body copy, which made every card
   read as equally important. Dropping it a step creates a clear first and
   second line of reading. */
.tool__meta, .pick-row__meta, .cat-tile__count,
.creation-card__meta, .res-item__meta { font-weight: 500; }

/* Cards were all at one elevation, so nothing receded. Interactive cards
   keep the lift; static containers sit flat on the paper. */
.card { box-shadow: none; border-color: var(--border); }
.card--tap, .creation-card, .hist-item, .hero, .mission { box-shadow: var(--shadow); }
.card--tap:hover { box-shadow: var(--shadow-lift); }

/* A quieter empty day in the streak strip. A centred dot read as debris
   scattered across the row; an empty box simply reads as "not yet". */
.week__day b { opacity: 1; }
.week__day:not(.hit) b { color: var(--border); font-size: 0; }
.week__day:not(.hit) b::after { content: '·'; font-size: 15px; color: var(--border); }

/* Consistent rhythm between stacked sections. */
.sec { margin-top: 26px; }
.view > .sec:first-of-type { margin-top: 20px; }

/* ===========================================================================
   LESSON PLANNER + STARTER PATH
   =========================================================================== */

.plan-week { display: grid; gap: 12px; }
.plan-day { padding: 16px 18px; }
.plan-day--free { background: var(--surface-2); border-style: dashed; }
.plan-day__head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.plan-day__name {
  font-family: var(--font-display); font-weight: 700; font-size: 14px;
  text-transform: uppercase; letter-spacing: 0.06em; color: var(--dim); flex: 1;
}
.plan-day__clear { font-size: 12px; font-weight: 700; color: var(--rose); }
.plan-day__title { font-family: var(--font-display); font-weight: 700; font-size: 17px; line-height: 1.25; }
.plan-day__meta { font-size: 13px; color: var(--dim); font-weight: 500; margin-top: 3px; }
.plan-day__act { font-size: 13.5px; font-weight: 600; margin-top: 7px; color: var(--violet); }
.plan-day__note {
  font-size: 13px; line-height: 1.5; margin-top: 8px; padding-left: 10px;
  border-left: 2px solid var(--border); color: var(--dim);
}
.plan-day__free { font-size: 14px; color: var(--dim); font-weight: 500; }

.print-only { display: none; }

/* Starter path */
.starter-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.starter-step {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 11px 0; border-top: 1px solid var(--border);
}
.starter-step:first-of-type { border-top: none; }
.starter-step__mark {
  flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%;
  display: grid; place-items: center;
  font-family: var(--font-mono); font-size: 12px; font-weight: 700;
  background: var(--surface-2); color: var(--dim); border: 1px solid var(--border);
}
.starter-step.is-done .starter-step__mark { background: var(--sprout); color: #fff; border-color: var(--sprout); }
.starter-step.is-next .starter-step__mark { background: var(--violet); color: #fff; border-color: var(--violet); }
[data-theme="dark"] .starter-step.is-next .starter-step__mark { color: var(--ink); }
.starter-step__body { flex: 1; min-width: 0; }
.starter-step__title { font-weight: 700; font-size: 15px; line-height: 1.35; display: block; }
.starter-step.is-done .starter-step__title { color: var(--dim); text-decoration: line-through; text-decoration-thickness: 1px; }
.starter-step__desc { font-size: 13px; color: var(--dim); font-weight: 500; line-height: 1.45; display: block; margin-top: 2px; }
.starter-step__go {
  flex-shrink: 0; font-size: 12.5px; font-weight: 700; color: var(--violet);
  padding: 4px 8px; align-self: center; white-space: nowrap;
}

@media print {
  .print-only { display: block !important; text-align: center; border-bottom: 2px solid #000; padding-bottom: 14px; margin-bottom: 18px; }
  /* A week fits one sheet as a stacked list; a five-column grid would set
     the type too small to be useful at the front of a lesson. */
  .plan-week { gap: 0 !important; }
  .plan-day {
    border: none !important; border-bottom: 1px solid #bbb !important;
    border-radius: 0 !important; box-shadow: none !important;
    background: #fff !important; padding: 10px 0 !important;
    break-inside: avoid;
  }
  .plan-day--free { display: none !important; }
  .plan-day__name { color: #000 !important; }
  .plan-day__act { color: #000 !important; }
  .plan-day__note { color: #333 !important; border-left-color: #999 !important; }
}

/* ===========================================================================
   INTERACTION PASS
   Every control should answer three questions without being told: can I
   press this, am I pressing it now, and did it work. Everything below is
   transform/opacity/border only, so none of it costs a frame on the budget
   Android hardware these classrooms actually run.
   =========================================================================== */

/* --- icon buttons: same edge language as the main buttons --- */
.icon-btn {
  border: 1.5px solid var(--border);
  position: relative;
  transition: transform 0.16s var(--pop), border-color 0.2s, background 0.2s, color 0.2s;
}
.icon-btn:hover {
  transform: translateY(-1.5px);
  border-color: var(--violet);
  color: var(--violet);
}
.icon-btn:active { transform: scale(0.9); }

/* --- tappable cards: a defined edge on hover, and the chevron leads --- */
.card--tap {
  border-width: 1.5px;
  transition:
    transform 0.2s var(--pop),
    box-shadow 0.22s var(--ease),
    border-color 0.2s var(--ease);
}
.card--tap:hover { border-color: var(--violet); }
.card--tap:active { transform: translateY(0) scale(0.982); }

/* Row-style pickers were the one tappable surface with no press state. */
.pick-row, .res-item, .module-row {
  border-width: 1.5px;
  transition: transform 0.18s var(--pop), border-color 0.2s, box-shadow 0.2s;
}
.pick-row:hover, .res-item:hover { border-color: var(--violet); }
.pick-row:active, .res-item:active { transform: scale(0.985); }
.pick-row__go { transition: transform 0.2s var(--pop), color 0.2s; }
.pick-row:hover .pick-row__go { transform: translateX(3px); color: var(--violet); }

/* --- inputs: the focus state was a browser default outline --- */
.input {
  border-width: 1.5px;
  transition: border-color 0.18s var(--ease), box-shadow 0.18s var(--ease), background 0.18s;
}
.input:hover { border-color: var(--dim); }
.input:focus {
  outline: none;
  border-color: var(--violet);
  box-shadow: 0 0 0 3.5px rgba(79, 70, 184, 0.16);
  box-shadow: 0 0 0 3.5px color-mix(in srgb, var(--violet) 15%, transparent);
}

/* --- chips: interactive ones now look interactive --- */
button.chip { transition: transform 0.16s var(--pop), border-color 0.2s, background 0.2s; }
button.chip:hover { border-color: var(--violet); color: var(--violet); transform: translateY(-1px); }
button.chip:active { transform: scale(0.94); }

/* --- segmented control: the thumb slides rather than jumping --- */
.segment button {
  border: 1.5px solid transparent;
  transition: background 0.22s var(--ease), color 0.22s var(--ease), border-color 0.22s;
}
.segment button.on { border-color: var(--border); }

/* --- quiz options: the most-pressed control in the app --- */
.opt {
  border-width: 1.5px;
  transition: transform 0.16s var(--pop), border-color 0.2s, background 0.2s, box-shadow 0.2s;
}
.opt:not([disabled]):hover {
  border-color: var(--violet);
  transform: translateX(3px);
  box-shadow: var(--shadow);
}
.opt:not([disabled]):active { transform: scale(0.99); }
.opt__key { transition: background 0.2s, color 0.2s, border-color 0.2s; }
.opt:not([disabled]):hover .opt__key { background: var(--violet); color: #fff; border-color: var(--violet); }

/* --- progress bars fill rather than snap, so a gain is legible --- */
.bar__fill { transition: width 0.7s var(--ease); }

/* --- category and template tiles: lift and settle --- */
.cat-tile, .tpl-tile { border-width: 1.5px; }
.cat-tile:hover, .tpl-tile:hover { border-color: var(--violet); transform: translateY(-3px); }
.cat-tile:active, .tpl-tile:active { transform: translateY(-1px) scale(0.985); }
.cat-tile__emoji, .tpl-tile__emoji { transition: transform 0.28s var(--pop); }
.cat-tile:hover .cat-tile__emoji, .tpl-tile:hover .tpl-tile__emoji { transform: scale(1.12) rotate(-4deg); }

/* --- starter path: the next step should pull the eye --- */
.starter-step.is-next .starter-step__mark { position: relative; }
.starter-step.is-next .starter-step__mark::after {
  content: ''; position: absolute; inset: 0; border-radius: 50%;
  background: var(--violet); z-index: -1;
  animation: pulseRing 2.4s var(--ease) infinite;
}
.starter-step__go { transition: transform 0.18s var(--pop), color 0.2s; border-radius: var(--r-sm); }
.starter-step__go:hover { transform: translateX(3px); }

/* --- lesson planner days --- */
.plan-day { border-width: 1.5px; transition: border-color 0.2s, transform 0.18s var(--pop); }
.plan-day--free:hover { border-color: var(--violet); }
.plan-day__clear { transition: opacity 0.18s; opacity: 0.65; border-radius: var(--r-sm); padding: 2px 6px; }
.plan-day__clear:hover { opacity: 1; }

/* --- badges: earned ones respond, locked ones stay quiet --- */
.badge:not(.locked) { transition: transform 0.24s var(--pop); }
.badge:not(.locked):hover { transform: translateY(-3px) scale(1.02); }

/* Anyone who has asked their device to calm down gets a still interface. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
  .btn:hover, .card--tap:hover, .cat-tile:hover, .tpl-tile:hover,
  .icon-btn:hover, .pick-row:hover, .opt:not([disabled]):hover { transform: none !important; }
}

/* ===========================================================================
   HERO — the first thing anyone sees
   The level card was a white box like every other card, so opening the app
   had no moment. It is now the one saturated surface on the screen: the
   student's own progress, in their band's colour, with the ring reading as
   light against it. Everything else on the page stays quiet so this lands.
   =========================================================================== */

.hero {
  background:
    linear-gradient(180deg, rgba(0,0,0,0) 34%, rgba(0,0,0,.16) 100%),
    radial-gradient(120% 140% at 88% 6%, rgba(255,255,255,.20) 0%, rgba(255,255,255,0) 46%),
    linear-gradient(152deg,
      color-mix(in srgb, var(--violet) 84%, #000) 0%,
      var(--violet) 44%,
      color-mix(in srgb, var(--accent-2) 92%, var(--violet)) 122%);
  color: #fff;
  border: none;
  border-radius: var(--r-lg);
  padding: 24px 22px;
  box-shadow: var(--shadow-accent);
  position: relative;
  overflow: hidden;
}
/* Fallback for engines without color-mix */
@supports not (background: color-mix(in srgb, red 50%, blue)) {
  .hero { background: linear-gradient(152deg, #3d31b0 0%, #5b4be8 46%, #9333ea 128%); }
  .result { background: linear-gradient(150deg, #3d31b0 0%, #5b4be8 50%, #9333ea 128%); }
  .btn--violet { background: linear-gradient(135deg, #6f60ec 0%, #5b4be8 42%, #8b3fe0 100%); }
}

/* The margin rule stays off the hero. It is a paper detail, and against a
   saturated gradient it read as a stray mark rather than a considered edge.
   It still marks the student's own work everywhere it belongs: saved
   creations, prompt history, and chapter cards. */

.hero__hi, .hero .hero__title { color: #fff; }
.hero__title { opacity: 0.92; font-weight: 600; }
.hero .xpline b { color: #fff; }
.hero .xpline small { color: rgba(255,255,255,.72); }

/* The track needs to read against a saturated ground, not a white one. */
.hero .ring__track { stroke: rgba(255,255,255,.22); }
.hero .ring__lv { border-color: transparent; background: rgba(0,0,0,.34); backdrop-filter: blur(4px); }
.hero .bar { background: rgba(255,255,255,.20); }

/* Streak strip: glass tiles rather than paper ones. */
.hero .week__day {
  background: rgba(0,0,0,.14);
  border-color: rgba(255,255,255,.20);
  color: #fff;
  font-weight: 700;
}
.hero .week__day.hit { background: rgba(255,255,255,.26); border-color: rgba(255,255,255,.42); }
.hero .week__day.today { border-color: var(--volt); box-shadow: 0 0 0 1.5px var(--volt); }
.hero .week__day:not(.hit) b::after { color: rgba(255,255,255,.4); }

/* --- stat cards: give the four numbers some presence --- */
.stat__k { font-family: var(--font-display); letter-spacing: -0.02em; }
.stat { position: relative; overflow: hidden; }
.stat::after {
  content: '';
  position: absolute; right: -18px; top: -18px;
  width: 62px; height: 62px; border-radius: 50%;
  background: var(--violet);
  opacity: 0.07;
  transition: transform 0.3s var(--pop), opacity 0.3s;
}
.stat:hover::after { transform: scale(1.25); opacity: 0.12; }

/* --- mission: the day's task keeps its dark card, warmed slightly so it
   sits in the same world as the hero rather than reading as a leftover --- */
.mission {
  background: linear-gradient(150deg, var(--ink) 0%, var(--ink-2) 100%);
  border-radius: var(--r-lg);
}

/* ===========================================================================
   AUDIT FIXES
   =========================================================================== */

/* A destructive action should be the quietest control on its card. It reads
   as plain text and only picks up its warning colour when reached for, so
   "Remove" stops competing with "Open" for a student's attention. */
.creation-card__actions .creation-card__del {
  font-size: 12px; font-weight: 700;
  color: var(--dim);
  background: none; border: 1px solid transparent;
  padding: 6px 10px; border-radius: var(--pill);
  transition: color 0.18s, background 0.18s, border-color 0.18s;
}
.creation-card__actions .creation-card__del:hover {
  color: var(--rose);
  background: color-mix(in srgb, var(--rose) 8%, transparent);
  border-color: color-mix(in srgb, var(--rose) 30%, transparent);
}

/* Mastery on a tool row was a number in the meta line and nothing else.
   The bar makes progress legible at a glance down the list, which is the
   whole point of laying the tools out as a path. */
.tool__mastery { display: block; margin-top: 7px; max-width: 150px; }

/* Section headings sit in a consistent column now that the emoji are gone,
   so the eyebrow rule can do the separating work instead. */
.sec-head h2 { letter-spacing: -0.014em; }

/* The topbar chips were three different pill colours side by side, which
   made the header the busiest strip on the screen. They now share one
   quiet container treatment and let their icon carry the meaning. */
.topbar .chip {
  background: var(--surface-2);
  border-color: var(--border);
  color: var(--text);
  font-weight: 700;
}
.topbar .chip--volt { color: var(--volt-deep); }
.topbar .chip--flame { color: var(--flame-deep); }
[data-theme="dark"] .topbar .chip--volt { color: var(--volt); }
[data-theme="dark"] .topbar .chip--flame { color: var(--flame); }

/* ===========================================================================
   AUDIT ROUND 2
   =========================================================================== */

/* --- Earned badges were the emptiest cards on the page ---------------------
   A locked badge carried a hint and a progress bar; an earned one carried an
   emoji and a name. The reward for earning a badge was that its card lost
   content. Earned badges now take their rarity colour, keep full-colour art
   and state when they were won. */
.badge.earned .badge__face {
  background:
    linear-gradient(180deg, rgba(255,255,255,.5), rgba(255,255,255,0) 60%),
    color-mix(in srgb, var(--violet) 9%, var(--surface));
  border-color: color-mix(in srgb, var(--violet) 34%, transparent);
  box-shadow: 0 2px 10px color-mix(in srgb, var(--violet) 14%, transparent);
}
.badge--rare.earned .badge__face {
  background: linear-gradient(180deg, rgba(255,255,255,.5), rgba(255,255,255,0) 60%), color-mix(in srgb, var(--sky) 11%, var(--surface));
  border-color: color-mix(in srgb, var(--sky) 40%, transparent);
  box-shadow: 0 2px 10px color-mix(in srgb, var(--sky) 16%, transparent);
}
.badge--epic.earned .badge__face {
  background: linear-gradient(180deg, rgba(255,255,255,.5), rgba(255,255,255,0) 60%), color-mix(in srgb, var(--violet) 13%, var(--surface));
  border-color: color-mix(in srgb, var(--violet) 44%, transparent);
  box-shadow: 0 2px 12px color-mix(in srgb, var(--violet) 20%, transparent);
}
.badge--legendary.earned .badge__face {
  background: linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,0) 60%), color-mix(in srgb, var(--volt) 20%, var(--surface));
  border-color: var(--volt);
  box-shadow: 0 2px 14px color-mix(in srgb, var(--volt) 34%, transparent);
}
.badge__earned {
  font-size: 11px; font-weight: 800; letter-spacing: .04em;
  color: var(--sprout-deep); text-transform: uppercase;
}
[data-theme="dark"] .badge__earned { color: var(--sprout); }
.badge__count { font-family: var(--font-mono); font-size: 11px; font-weight: 700; color: var(--dim); }
.badge.earned .badge__emoji { filter: none; }

/* --- Level chip in the header --- */
.chip--lv { font-family: var(--font-mono); font-weight: 700; }

/* --- Quiz result: the payoff of the whole loop ---------------------------
   This is the moment a student has just achieved something, and it was a
